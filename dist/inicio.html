<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modernización UNI</title>
<style>
:root{
  --red:#8a1c24; --navy:#14233f; --ink:#1d2433; --muted:#5b6475; --line:#e3e6ee;
  --bg:#f4f6fb; --card:#ffffff; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* Cabecera */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;gap:20px;height:80px}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand img,.brand svg{height:58px;width:auto;display:block}
#unidad img{height:42px}
.brand{align-items:center}
.brand>span{display:flex;align-items:center;gap:10px}
.brand .u{font-size:12px;font-weight:700;line-height:1.15;color:var(--navy);text-transform:uppercase}
.brand .sep{width:1px;height:34px;background:#c9ceda}
.brand .m{font-size:17px;font-weight:500;line-height:1.1;color:var(--navy)}
nav{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
nav a{font-size:12.5px;font-weight:600;letter-spacing:.2px;color:#2d3750;padding:30px 11px 26px;border-bottom:3px solid transparent;text-transform:uppercase;white-space:nowrap}
nav a:hover{color:var(--red)}
nav a.on{color:var(--red);border-bottom-color:var(--red)}
.lupa{border:0;background:none;cursor:pointer;padding:8px;margin-left:6px;border-left:1px solid var(--line);border-radius:0}
.lupa svg{width:22px;height:22px;stroke:var(--navy)}
.burger{display:none;border:0;background:none;font-size:26px;margin-left:auto;cursor:pointer;color:var(--navy)}

/* Hero */
.hero{position:relative;background:linear-gradient(100deg,#fff 0%,#f1f3f9 55%,#e9edf6 100%);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;min-height:330px;align-items:center}
.hero .txt{padding:36px 0 90px;position:relative;z-index:2}
.eyebrow{font-size:11.5px;letter-spacing:3px;color:#5b6475;text-transform:uppercase;font-weight:600}
h1{margin:12px 0 4px;font-size:clamp(34px,5vw,54px);line-height:1;font-weight:800;color:#1a1f2b;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--red)}
.hero h2{margin:0;font-weight:400;font-size:clamp(24px,3.2vw,36px);color:#1a1f2b}
.hero p{margin:14px 0 0;color:#3b4457;font-size:15.5px;max-width:520px}
.hero .rule{width:28px;height:3px;background:var(--red);margin-top:18px;border-radius:2px}
.hero .img{position:absolute;right:0;top:0;bottom:0;width:52%;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);background:#cfd8e8}
.hero .img img,.hero .img svg{width:100%;height:100%;object-fit:cover;display:block}

/* Tarjetas */
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:-72px;position:relative;z-index:3}
.card{background:var(--card);border-radius:var(--radius);padding:16px 14px 14px;box-shadow:0 8px 24px rgba(20,35,63,.10);border:1px solid #eef0f6;display:flex;flex-direction:column;min-height:190px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,35,63,.16)}
.card .top{display:flex;align-items:center;gap:8px}
.ico{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none}
.ico svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:12.5px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.2px;flex:1}
.chev{width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center;font-size:13px;font-weight:700}
.kpi{display:flex;align-items:center;gap:10px;margin:14px 0 auto}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:#e8ebf3}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;color:#1a1f2b}
.kpi .n{font-size:26px;font-weight:800;line-height:1;color:#1a1f2b}
.kpi .d{font-size:11.5px;color:#4a5265;line-height:1.3;margin-top:3px}
.card .cta{margin-top:12px;font-size:12.5px;font-weight:700;color:var(--c)}

/* Proyectos */
.sec-h{display:flex;align-items:center;gap:18px;margin:34px 0 14px}
.sec-h h2{margin:0;font-size:20px;font-weight:600}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.sec-h a{color:#1f5fbf;font-weight:700;font-size:14px}
.proj{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:40px}
.p{background:color-mix(in srgb,var(--c) 7%,#fff);border:1px solid color-mix(in srgb,var(--c) 18%,#fff);border-radius:var(--radius);padding:16px;display:flex;gap:12px}
.p .ico{border-radius:12px;width:44px;height:44px}
.p h4{margin:0 0 4px;font-size:14.5px;color:#111}
.p p{margin:0;font-size:13px;color:#434b5c;line-height:1.4}
.p small{display:block;margin-top:8px;font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.3px}

/* Páginas interiores */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 6px 18px rgba(20,35,63,.06);margin-bottom:40px}
.panel .tools{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.panel input[type=search]{flex:1;min-width:200px;padding:10px 14px;border:1px solid #cfd5e3;border-radius:10px;font:inherit}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#f1f3f9;text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#3b4457;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafbfe}
.note{padding:14px 16px;border-radius:12px;background:#fff7e6;border:1px solid #f2d9a0;color:#6b4e00;font-size:14px;margin-bottom:18px}
.hero.inner .wrap{align-items:start}.hero.inner .txt{padding:36px 0 110px}.single{max-width:300px}

/* Búsqueda */
#ov{position:fixed;inset:0;background:rgba(20,35,63,.55);display:none;z-index:50;padding:70px 16px}
#ov.on{display:block}
.sb{max-width:680px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
.sb input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font-size:17px;outline:none;font-family:inherit}
.sb ul{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
.sb li a{display:block;padding:12px 20px;border-bottom:1px solid #f0f2f7}
.sb li a:hover{background:#f6f8fc}
.sb li b{display:block;font-size:14.5px}
.sb li span{font-size:12px;color:var(--muted)}
.sb .em{padding:20px;color:var(--muted);font-size:14px}
mark{background:#ffe9a8;padding:0 1px;border-radius:2px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14233f;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:60}

@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.proj{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .burger{display:block}
  .lupa{margin-left:0;border:0}
  nav{display:none;position:absolute;top:80px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;border-bottom:1px solid var(--line);padding:6px 20px}
  nav.open{display:flex}
  nav a{padding:12px 4px;border-bottom:1px solid #f0f2f7}
  .hero .wrap{grid-template-columns:1fr}
  .hero .img{position:relative;width:100%;height:200px;clip-path:none;order:-1}
  .hero .wrap{min-height:0}
  .hero .txt{padding:24px 0 90px}
}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}.proj{grid-template-columns:1fr}.brand .m{font-size:14px}}
@media(max-width:420px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" data-go="inicio" href="#">
      <span id="logo"></span>
      <span class="sep"></span>
      <span id="unidad"><span class="m">Unidad de<br>Modernización</span></span>
    </a>
    <nav id="nav"></nav>
    <button class="lupa" id="btnSearch" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="burger" id="burger" aria-label="Menú">☰</button>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="txt">
      <div class="eyebrow" id="eyebrow">Plataforma de modernización</div>
      <h1 id="h1">MODERNIZACIÓN <em>UNI</em></h1>
      <h2 id="h2">Estado actual</h2>
      <p id="sub">Una visión integrada del avance de la modernización institucional.</p>
      <div class="rule"></div>
    </div>
    <div class="img" id="heroImg"></div>
  </div>
</section>

<main class="wrap">
  <div id="cards" class="cards"></div>
  <div id="inner"></div>
</main>

<div id="ov"><div class="sb">
  <input id="q" type="search" placeholder="Buscar en la plataforma…" autocomplete="off">
  <ul id="res"></ul>
</div></div>
<div id="toast"></div>

  {k:'servicios',    t:'Servicios digitales',c:'#0e5f8a', ic:I.globe, cta:'Ver servicios'}
];
const PROJ_ICONS = {cap:I.cap, search:I.search, gear:I.gear, build:I.build, doc:I.doc, globe:I.globe, bulb:I.bulb, org:I.org, check:I.check};

/* ===== Datos de respaldo (los del prototipo) ===== */
const DEMO_RESUMEN = [
  {clave:'normativa',porcentaje:68,cifra:120,descripcion:'documentos normativos actualizados en 2026'},
  {clave:'procesos',porcentaje:76,cifra:58,descripcion:'procesos identificados de 76'},
  {clave:'simplificacion',porcentaje:58,cifra:38,descripcion:'procedimientos revisados de 65'},
  {clave:'organizacion',porcentaje:82,cifra:42,descripcion:'unidades alineadas de 51'},
  {clave:'innovacion',porcentaje:64,cifra:8,descripcion:'iniciativas en marcha de 12'},
  {clave:'servicios',porcentaje:45,cifra:2,descripcion:'servicios disponibles de 5'}
];
const DEMO_PROJ = [
  {titulo:'Grados y Títulos',descripcion:'Simplificación y digitalización del trámite de Bachiller y Título Profesional.',responsable:'DIRCE',icono:'cap',color:'#a3202a'},
  {titulo:'Verificación de documentos UNI',descripcion:'Validación digital de diplomas y certificados emitidos por la UNI.',responsable:'DIPSODES',icono:'search',color:'#1f5fbf'},
  {titulo:'Servicios digitales verificables',descripcion:'Modelo replicable para DITT, Facultades y otras unidades.',responsable:'Unidad correspondiente',icono:'gear',color:'#6a3fc4'},
  {titulo:'Modernización del ROF',descripcion:'Actualización y alineamiento de la estructura organizacional.',responsable:'Unidad de Modernización',icono:'build',color:'#2e8b4a'}
];

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const pageKey = k => k === 'servicios' ? 'servicios-digitales' : k;
const svgIcon = p => `<svg viewBox="0 0 24 24">${p}</svg>`;

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}

function goto(key){
  const url = (CFG.nav||{})[pageKey(key)];
  if(url){ (window.top||window).location.href = url; }
  else toast('Falta la URL de «'+key+'» en config.json (nav). Luego ejecuta build.ps1.');
}

function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows;
}

const cache = {};
function sheet(tab){
  if(!CFG.sheetId) return Promise.reject(new Error('sin sheetId'));
  if(cache[tab]) return cache[tab];
  const url = `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
  return cache[tab] = fetch(url).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text() })
    .then(t=>{
      const rows = parseCSV(t).filter(r=>r.some(x=>x.trim()!==''));
      if(!rows.length) return {head:[],rows:[]};
      return {head:rows[0].map(h=>h.trim()), rows:rows.slice(1)};
    });
}
const asObjects = d => d.rows.map(r=>Object.fromEntries(d.head.map((h,i)=>[norm(h),r[i]??''])));

/* ===== Cabecera / navegación ===== */
function buildHeader(){
  $('#logo').innerHTML = CFG.logo
    ? `<img src="${esc(CFG.logo)}" alt="UNI">`
    : `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#fff" stroke="#8a1c24" stroke-width="3"/><path d="M24 8l12 4v10c0 8-5 13-12 17-7-4-12-9-12-17V12z" fill="#8a1c24"/><text x="24" y="28" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Arial">UNI</text></svg><span class="u">Universidad Nacional<br>de Ingeniería</span>`;
  if(CFG.unidad) $('#unidad').innerHTML = `<img src="${esc(CFG.unidad)}" alt="Unidad de Modernización">`;
  const items = [{k:'inicio',t:'Inicio'}, ...SECTIONS];
  $('#nav').innerHTML = items.map(s=>
    `<a href="#" data-go="${s.k}" class="${s.k===PAGE||(s.k==='servicios'&&PAGE==='servicios-digitales')?'on':''}">${esc(s.t)}</a>`).join('');
  document.addEventListener('click',e=>{
    const a=e.target.closest('[data-go]'); if(!a) return;
    e.preventDefault(); goto(a.dataset.go);
  });
  $('#burger').onclick=()=>$('#nav').classList.toggle('open');
}

function buildHero(sec){
  const hi = $('#heroImg');
  if(CFG.heroImage){ hi.innerHTML = `<img src="${esc(CFG.heroImage)}" alt="Universidad Nacional de Ingeniería">`; }
  else hi.innerHTML = `<svg viewBox="0 0 600 340" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb2e8"/><stop offset="1" stop-color="#d9e8f7"/></linearGradient></defs>
    <rect width="600" height="340" fill="url(#sk)"/>
    <ellipse cx="60" cy="230" rx="90" ry="70" fill="#3d7a3a"/><ellipse cx="560" cy="200" rx="70" ry="80" fill="#356f33"/>
    <rect x="70" y="170" width="470" height="150" fill="#f2efe8"/>
    <rect x="300" y="110" width="170" height="210" fill="#a8222b"/>
    ${[0,1,2,3].map(r=>[0,1,2,3,4].map(c=>`<rect x="${315+c*30}" y="${125+r*45}" width="18" height="28" fill="#33425c"/>`).join('')).join('')}
    ${[0,1,2].map(r=>[0,1,2,3,4,5,6,7].map(c=>`<rect x="${85+c*35}" y="${185+r*40}" width="22" height="24" fill="#8fa3bf"/>`).join('')).join('')}
    <rect x="70" y="316" width="470" height="24" fill="#c9c5ba"/></svg>`;
  if(sec){
    $('#eyebrow').textContent='Unidad de Modernización · UNI';
    $('#h1').innerHTML = esc(sec.t.toUpperCase()).replace(/(\S+)$/,'<em>$1</em>');
    $('#h2').textContent='Modernización UNI';
    $('#sub').textContent = 'Seguimiento del avance en ' + sec.t.toLowerCase() + '.';
  }
}

/* ===== Tarjetas ===== */
function cardHTML(s, d){
  const pct = Math.max(0,Math.min(100,Number(d.porcentaje)||0));
  const R=30, C=2*Math.PI*R;
  return `<a class="card" href="#" data-go="${s.k}" style="--c:${s.c}">
    <div class="top"><span class="ico">${svgIcon(s.ic)}</span><h3>${esc(s.t)}</h3><span class="chev">›</span></div>
    <div class="kpi">
      <div class="ring"><svg viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="${R}"/><circle class="fg" cx="37" cy="37" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-pct/100)}"/></svg><b>${pct}%</b></div>
      <div><div class="n">${esc(d.cifra)}</div><div class="d">${esc(d.descripcion)}</div></div>
    </div>
    <div class="cta">${esc(s.cta)} →</div>
  </a>`;
}
function animateRings(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>
    document.querySelectorAll('.ring .fg').forEach(c=>c.style.strokeDashoffset=c.dataset.off)));
}

async function loadResumen(){
  try{ const d = asObjects(await sheet(CFG.tabs.resumen)); if(d.length) return d; }catch(e){}
  return DEMO_RESUMEN;
}

/* ===== Páginas ===== */
async function renderHome(){
  buildHero(null);
  const res = await loadResumen();
  const by = Object.fromEntries(res.map(r=>[norm(r.clave),r]));
  $('#cards').innerHTML = SECTIONS.map(s=>cardHTML(s, by[s.k]||{porcentaje:0,cifra:'–',descripcion:'Sin datos'})).join('');
  animateRings();

  let proj; try{ proj = asObjects(await sheet(CFG.tabs.proyectos)); if(!proj.length) throw 0 }catch(e){ proj = DEMO_PROJ }
  $('#inner').innerHTML = `
    <div class="sec-h"><h2>Proyectos de modernización</h2><span class="ln"></span></div>
    <div class="proj">${proj.map(p=>`
      <div class="p" style="--c:${esc(p.color||'#1f5fbf')}">
        <span class="ico">${svgIcon(PROJ_ICONS[p.icono]||I.gear)}</span>
        <div><h4>${esc(p.titulo)}</h4><p>${esc(p.descripcion)}</p><small>Responsable: ${esc(p.responsable)}</small></div>
      </div>`).join('')}</div>`;
}

async function renderSection(key){
  const s = SECTIONS.find(x=>x.k===key);
  buildHero(s); document.querySelector('.hero').classList.add('inner');
  const res = await loadResumen();
  const d = res.find(r=>norm(r.clave)===key) || {porcentaje:0,cifra:'–',descripcion:'Sin datos'};
  $('#cards').innerHTML = `<div class="single">${cardHTML(s,d).replace('href="#" data-go="'+key+'"','')}</div>`;
  animateRings();

  let html='';
  try{
    const t = await sheet(CFG.tabs[key]);
    if(!t.rows.length) throw new Error('vacía');
    html = `<div class="panel"><div class="tools"><input type="search" id="flt" placeholder="Filtrar ${esc(s.t.toLowerCase())}…"><span id="cnt"></span></div>
      <div class="tw"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody id="tb">${t.rows.map(r=>`<tr>${t.head.map((_,i)=>`<td>${linkify(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
    $('#inner').innerHTML = html;
    const cnt=()=>$('#cnt').textContent = [...$('#tb').rows].filter(r=>!r.hidden).length+' registros';
    cnt();
    $('#flt').oninput = e=>{ const q=norm(e.target.value); [...$('#tb').rows].forEach(r=>r.hidden = q && !norm(r.textContent).includes(q)); cnt(); };
  }catch(e){
    $('#inner').innerHTML = `<div class="note">${CFG.sheetId
      ? 'No se pudo leer la pestaña «'+esc(CFG.tabs[key])+'» del Google Sheets. Verifica que el archivo esté compartido como «Cualquier persona con el enlace – Lector» y que la pestaña exista.'
      : 'Aún no hay un Google Sheets conectado. Pega su ID en <b>config.json → sheetId</b> y vuelve a ejecutar build.ps1. El detalle de esta sección aparecerá aquí.'}</div>`;
  }
}
function linkify(v){
  const e = esc(v);
  return /^https?:\/\//.test(v.trim()) ? `<a href="${e}" target="_blank" rel="noopener" style="color:#1f5fbf;font-weight:600">Abrir</a>` : e;
}

/* ===== Búsqueda ===== */
let index = null;
async function buildIndex(){
  if(index) return index;
  index = SECTIONS.map(s=>({sec:s.k,title:s.t,text:'sección '+s.t,tit:true}));
  index.push({sec:'inicio',title:'Inicio',text:'inicio plataforma modernización estado actual',tit:true});
  const keys = [...SECTIONS.map(s=>s.k),'proyectos'];
  const out = await Promise.allSettled(keys.map(k=>sheet(CFG.tabs[k])));
  out.forEach((o,i)=>{
    if(o.status!=='fulfilled') return;
    const k = keys[i];
    o.value.rows.forEach(r=>index.push({sec:k==='proyectos'?'inicio':k, title:r[0]||'(sin título)', text:r.join(' · '), group:k}));
  });
  return index;
}
function openSearch(){ $('#ov').classList.add('on'); $('#q').focus(); buildIndex(); runSearch(); }
function closeSearch(){ $('#ov').classList.remove('on'); }
async function runSearch(){
  const q = norm($('#q').value.trim()), ul = $('#res');
  if(q.length<2){ ul.innerHTML='<div class="em">Escribe al menos 2 letras para buscar en normativa, procesos, simplificación, organización, innovación, servicios y proyectos.</div>'; return; }
  const idx = await buildIndex();
  const hits = idx.filter(x=>norm(x.title+' '+x.text).includes(q)).slice(0,30);
  const hl = s => { const e=esc(s), i=norm(e).indexOf(q); return i<0?e:e.slice(0,i)+'<mark>'+e.slice(i,i+q.length)+'</mark>'+e.slice(i+q.length); };
  ul.innerHTML = hits.length ? hits.map(h=>{
      const lab = (SECTIONS.find(s=>s.k===h.sec)||{t:'Inicio'}).t;
      return `<li><a href="#" data-go="${h.sec}"><b>${hl(h.title)}</b><span>${esc(lab)}${h.tit?'':' · '+hl(h.text.slice(0,110))}</span></a></li>`;
    }).join('') : '<div class="em">Sin resultados para «'+esc($('#q').value)+'».</div>';
}
$('#btnSearch').onclick = openSearch;
$('#q').addEventListener('input', runSearch);
$('#ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeSearch(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSearch(); });

/* ===== Arranque ===== */
buildHeader();
const secKey = PAGE==='servicios-digitales' ? 'servicios' : PAGE;
if(secKey==='inicio') renderHome(); else renderSection(secKey);
</script>

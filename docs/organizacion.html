<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modernización UNI</title>
<style>
:root{
  --red:#8a1c24; --navy:#14233f; --ink:#1d2433; --muted:#5b6475; --line:#e3e6ee;
  --bg:#f4f6fb; --card:#ffffff; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* Cabecera */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;gap:20px;height:80px}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand img,.brand svg{height:58px;width:auto;display:block}
#unidad img{height:42px}
.brand{align-items:center}
.brand>span{display:flex;align-items:center;gap:10px}
.brand .u{font-size:12px;font-weight:700;line-height:1.15;color:var(--navy);text-transform:uppercase}
.brand .sep{width:1px;height:34px;background:#c9ceda}
.brand .m{font-size:17px;font-weight:500;line-height:1.1;color:var(--navy)}
nav{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
nav a{font-size:12.5px;font-weight:600;letter-spacing:.2px;color:#2d3750;padding:30px 11px 26px;border-bottom:3px solid transparent;text-transform:uppercase;white-space:nowrap}
nav a:hover{color:var(--red)}
nav a.on{color:var(--red);border-bottom-color:var(--red)}
.lupa{border:0;background:none;cursor:pointer;padding:8px;margin-left:6px;border-left:1px solid var(--line);border-radius:0}
.lupa svg{width:22px;height:22px;stroke:var(--navy)}
.burger{display:none;border:0;background:none;font-size:26px;margin-left:auto;cursor:pointer;color:var(--navy)}

/* Hero */
.hero{position:relative;background:linear-gradient(100deg,#fff 0%,#f1f3f9 55%,#e9edf6 100%);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;min-height:330px;align-items:center}
.hero .txt{padding:36px 0 90px;position:relative;z-index:2}
.eyebrow{font-size:11.5px;letter-spacing:3px;color:#5b6475;text-transform:uppercase;font-weight:600}
h1{margin:12px 0 4px;font-size:clamp(34px,5vw,54px);line-height:1;font-weight:800;color:#1a1f2b;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--red)}
.hero h2{margin:0;font-weight:400;font-size:clamp(24px,3.2vw,36px);color:#1a1f2b}
.hero p{margin:14px 0 0;color:#3b4457;font-size:15.5px;max-width:520px}
.hero .rule{width:28px;height:3px;background:var(--red);margin-top:18px;border-radius:2px}
.hero .img{position:absolute;right:0;top:0;bottom:0;width:52%;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);background:#cfd8e8}
.hero .img img,.hero .img svg{width:100%;height:100%;object-fit:cover;display:block}

/* Tarjetas */
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:-72px;position:relative;z-index:3}
.card{background:var(--card);border-radius:var(--radius);padding:16px 14px 14px;box-shadow:0 8px 24px rgba(20,35,63,.10);border:1px solid #eef0f6;display:flex;flex-direction:column;min-height:190px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,35,63,.16)}
.card .top{display:flex;align-items:center;gap:8px}
.ico{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none}
.ico svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:12.5px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.2px;flex:1}
.chev{width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center;font-size:13px;font-weight:700}
.kpi{display:flex;align-items:center;gap:10px;margin:14px 0 auto}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:#e8ebf3}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;color:#1a1f2b}
.kpi .n{font-size:26px;font-weight:800;line-height:1;color:#1a1f2b}
.kpi .d{font-size:11.5px;color:#4a5265;line-height:1.3;margin-top:3px}
.card .cta{margin-top:12px;font-size:12.5px;font-weight:700;color:var(--c)}

/* Proyectos */
.sec-h{display:flex;align-items:center;gap:18px;margin:34px 0 14px}
.sec-h h2{margin:0;font-size:20px;font-weight:600}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.sec-h a{color:#1f5fbf;font-weight:700;font-size:14px}
.proj{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:40px}
.p{background:color-mix(in srgb,var(--c) 7%,#fff);border:1px solid color-mix(in srgb,var(--c) 18%,#fff);border-radius:var(--radius);padding:16px;display:flex;gap:12px}
.p .ico{border-radius:12px;width:44px;height:44px}
.p h4{margin:0 0 4px;font-size:14.5px;color:#111}
.p p{margin:0;font-size:13px;color:#434b5c;line-height:1.4}
.p small{display:block;margin-top:8px;font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.3px}

/* Páginas interiores */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 6px 18px rgba(20,35,63,.06);margin-bottom:40px}
.panel .tools{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.panel input[type=search]{flex:1;min-width:200px;padding:10px 14px;border:1px solid #cfd5e3;border-radius:10px;font:inherit}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#f1f3f9;text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#3b4457;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafbfe}
.note{padding:14px 16px;border-radius:12px;background:#fff7e6;border:1px solid #f2d9a0;color:#6b4e00;font-size:14px;margin-bottom:18px}
.hero.inner .wrap{align-items:start}.hero.inner .txt{padding:36px 0 110px}.single{max-width:300px}

/* Búsqueda */
#ov{position:fixed;inset:0;background:rgba(20,35,63,.55);display:none;z-index:50;padding:70px 16px}
#ov.on{display:block}
.sb{max-width:680px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
.sb input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font-size:17px;outline:none;font-family:inherit}
.sb ul{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
.sb li a{display:block;padding:12px 20px;border-bottom:1px solid #f0f2f7}
.sb li a:hover{background:#f6f8fc}
.sb li b{display:block;font-size:14.5px}
.sb li span{font-size:12px;color:var(--muted)}
.sb .em{padding:20px;color:var(--muted);font-size:14px}
mark{background:#ffe9a8;padding:0 1px;border-radius:2px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14233f;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:60}

@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.proj{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .burger{display:block}
  .lupa{margin-left:0;border:0}
  nav{display:none;position:absolute;top:80px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;border-bottom:1px solid var(--line);padding:6px 20px}
  nav.open{display:flex}
  nav a{padding:12px 4px;border-bottom:1px solid #f0f2f7}
  .hero .wrap{grid-template-columns:1fr}
  .hero .img{position:relative;width:100%;height:200px;clip-path:none;order:-1}
  .hero .wrap{min-height:0}
  .hero .txt{padding:24px 0 90px}
}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}.proj{grid-template-columns:1fr}.brand .m{font-size:14px}}
@media(max-width:420px){.cards{grid-template-columns:1fr}}
/* ===== Página Organización ===== */
main.wide{max-width:1560px}
.org{display:grid;grid-template-columns:230px 1fr;gap:22px;padding:22px 0 40px;align-items:start}
.side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;position:sticky;top:96px}
.side .sh{display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:8px}
.side .sh svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font:inherit;font-size:14px;color:#2d3750;cursor:pointer}
.side button svg{width:18px;height:18px;stroke:#5b6475;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side button:hover{background:#f4f6fb}
.side button.on{background:#fdecee;color:var(--red);font-weight:700}
.side button.on svg{stroke:var(--red)}
.ohead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.ohead h1{font-size:30px;margin:0;color:#1a1f2b;letter-spacing:0}
.ohead p{margin:4px 0 0;color:var(--muted)}
.kpis{display:flex;gap:12px;flex-wrap:wrap}
.kpi2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:12px;min-width:150px}
.kpi2 svg{width:30px;height:30px;stroke:var(--navy);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.kpi2 small{display:block;font-size:12px;color:var(--muted)}
.kpi2 b{font-size:24px;line-height:1.1;color:#1a1f2b}

.chartgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:relative}
.chartbox:fullscreen{padding:18px;overflow:auto}
.ctools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ctools h2{margin:0;font-size:20px;color:var(--red)}
.tag{background:#fdecee;color:var(--red);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.srch{position:relative;margin-left:auto;flex:1;min-width:180px;max-width:300px}
.srch input{width:100%;padding:9px 12px;border:1px solid #cfd5e3;border-radius:10px;font:inherit;font-size:14px}
.srch ul{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;margin:4px 0 0;padding:0;list-style:none;box-shadow:0 10px 24px rgba(0,0,0,.15);z-index:15;max-height:260px;overflow:auto;display:none}
.srch ul.on{display:block}
.srch li{padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid #f0f2f7}
.srch li:hover{background:#f4f6fb}
.srch li small{color:var(--muted);margin-left:6px}
.btn{border:1px solid #cfd5e3;background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.btn:hover{background:#f4f6fb}
.vp{height:640px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:grab;position:relative}
.vp.drag{cursor:grabbing}
.chartbox:fullscreen .vp{height:calc(100vh - 150px)}
.stage{position:relative;line-height:0;transition:width .2s}
.stage img{width:100%;height:auto;display:block;user-select:none}
.hs{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:4px}
.hs:hover{outline:2px solid rgba(31,95,191,.7);background:rgba(31,95,191,.08)}
.hs.sel{outline:3px solid #1f5fbf;box-shadow:0 0 0 4px rgba(31,95,191,.25);background:rgba(31,95,191,.06)}
.hs:focus-visible{outline:3px solid #1f5fbf}
.zoom{position:absolute;left:26px;top:112px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid #cfd5e3;background:#fff;font-size:20px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:#4a5265}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15)}

.detail{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:sticky;top:96px}
.dh{background:#1f4f9a;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.dh h3{margin:0;font-size:16px;flex:1;letter-spacing:.2px}
.dh button{border:0;background:none;color:#fff;font-size:18px;cursor:pointer}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 6px;font:inherit;font-size:12px;font-weight:600;color:#4a5265;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.db{padding:16px;max-height:560px;overflow:auto;font-size:13.5px;line-height:1.5}
.dempty{padding:28px 20px;color:var(--muted);font-size:14px}
.ucard{display:flex;align-items:center;gap:12px;background:#fdecee;border-radius:12px;padding:12px;margin-bottom:12px}
.ucard .ico{--c:var(--red);width:40px;height:40px}
.ucard b{flex:1;font-size:14.5px}
.pill{background:#d9f3e1;color:#1e7a3c;border-radius:8px;padding:4px 10px;font-weight:700;font-size:12px}
.kv{width:100%;font-size:13.5px;margin-bottom:14px}
.kv td{padding:5px 0;border:0;vertical-align:top}
.kv td:first-child{width:112px;font-weight:700;color:#2d3750}
.kv tr:hover td{background:none}
.db h4{margin:14px 0 8px;color:#1f5fbf;font-size:15px}
.nat{background:#eaf1fd;border-radius:10px;padding:12px 14px;color:#1f3a6b}
.nat p{margin:0 0 6px}
.nat ul,.db ul.bl{margin:6px 0 0;padding-left:20px}
.fl{list-style:none;margin:0;padding:0}
.fl li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f0f2f7}
.fl .k{flex:none;width:24px;height:24px;border-radius:50%;background:#eaf1fd;color:#1f5fbf;font-weight:700;font-size:12px;display:grid;place-items:center}
.ulist{list-style:none;margin:0;padding:0}
.ulist li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.ulist li:hover{background:#f4f6fb}
.ulist small{color:var(--muted)}
.mt{width:100%;font-size:13px}
.mt th,.mt td{padding:7px 8px}
.empty{color:var(--muted);padding:6px 0}

.panel .rofs details{border-bottom:1px solid var(--line);padding:8px 0}
.rofs summary{cursor:pointer;font-weight:600}
.rofs details p,.rofs details li{font-size:14px;margin:6px 0}

@media(max-width:1100px){.chartgrid{grid-template-columns:1fr}.detail{position:static}}
@media(max-width:900px){
  .org{grid-template-columns:1fr}
  .side{position:static;display:flex;overflow-x:auto;gap:4px}
  .side .sh{display:none}
  .side button{white-space:nowrap;width:auto}
  .vp{height:480px}
}

</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" data-go="inicio" href="#">
      <span id="logo"></span>
      <span class="sep"></span>
      <span id="unidad"><span class="m">Unidad de<br>Modernización</span></span>
    </a>
    <nav id="nav"></nav>
    <button class="lupa" id="btnSearch" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="burger" id="burger" aria-label="Menú">☰</button>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="txt">
      <div class="eyebrow" id="eyebrow">Plataforma de modernización</div>
      <h1 id="h1">MODERNIZACIÓN <em>UNI</em></h1>
      <h2 id="h2">Estado actual</h2>
      <p id="sub">Una visión integrada del avance de la modernización institucional.</p>
      <div class="rule"></div>
    </div>
    <div class="img" id="heroImg"></div>
  </div>
</section>

<main class="wrap">
  <div id="cards" class="cards"></div>
  <div id="inner"></div>
</main>

<div id="ov"><div class="sb">
  <input id="q" type="search" placeholder="Buscar en la plataforma…" autocomplete="off">
  <ul id="res"></ul>
</div></div>
<div id="toast"></div>

<script>
/* ===== Configuración (inyectada por build.ps1 desde config.json) ===== */
const CFG = {"sheetId":"1uZXfUJEjqB4Cp5wfel468guVGFYdLR3NtXSsrEAdOWU","logo":"img/logo-uni.png","heroImage":"img/hero-organizacion.jpg","tabs":{"resumen":"Resumen","proyectos":"Proyectos","normativa":"Normativa","procesos":"Procesos","simplificacion":"Simplificacion","organizacion":"Organizacion","innovacion":"Innovacion","servicios":"ServiciosDigitales"},"nav":{"inicio":"inicio.html","normativa":"normativa.html","procesos":"procesos.html","simplificacion":"simplificacion.html","organizacion":"organizacion.html","innovacion":"innovacion.html","servicios-digitales":"servicios-digitales.html"},"unidad":"img/unidad.png","orgImage":"img/organigrama.jpg"};
const PAGE = 'organizacion';

/* ===== Definición de secciones ===== */
const I = {
  doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  check:'<path d="M7 3h7l4 4v14H7z"/><path d="M9.5 14l2 2 3.5-4"/>',
  org:'<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.3 1 2.5h6c0-1.2.3-1.8 1-2.5A6 6 0 0012 3z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  search:'<rect x="5" y="3" width="11" height="16" rx="1"/><circle cx="14" cy="14" r="3"/><path d="M16 16l3 3"/>',
  build:'<path d="M3 9l9-5 9 5M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>'
};
const SECTIONS = [
  {k:'normativa',    t:'Normativa',          c:'#a3202a', ic:I.doc,   cta:'Ver normativa'},
  {k:'procesos',     t:'Procesos',           c:'#1f5fbf', ic:I.gear,  cta:'Ver procesos'},
  {k:'simplificacion',t:'Simplificación',    c:'#2e8b4a', ic:I.check, cta:'Ver avances'},
  {k:'organizacion', t:'Organización',       c:'#e0572a', ic:I.org,   cta:'Ver organización'},
  {k:'innovacion',   t:'Innovación',         c:'#6a3fc4', ic:I.bulb,  cta:'Ver iniciativas'},
  {k:'servicios',    t:'Servicios digitales',c:'#0e5f8a', ic:I.globe, cta:'Ver servicios'}
];
const PROJ_ICONS = {cap:I.cap, search:I.search, gear:I.gear, build:I.build, doc:I.doc, globe:I.globe, bulb:I.bulb, org:I.org, check:I.check};

/* ===== Datos de respaldo (los del prototipo) ===== */
const DEMO_RESUMEN = [
  {clave:'normativa',porcentaje:68,cifra:120,descripcion:'documentos normativos actualizados en 2026'},
  {clave:'procesos',porcentaje:76,cifra:58,descripcion:'procesos identificados de 76'},
  {clave:'simplificacion',porcentaje:58,cifra:38,descripcion:'procedimientos revisados de 65'},
  {clave:'organizacion',porcentaje:82,cifra:42,descripcion:'unidades alineadas de 51'},
  {clave:'innovacion',porcentaje:64,cifra:8,descripcion:'iniciativas en marcha de 12'},

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const pageKey = k => k === 'servicios' ? 'servicios-digitales' : k;
const svgIcon = p => `<svg viewBox="0 0 24 24">${p}</svg>`;

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}

function goto(key){
  const url = (CFG.nav||{})[pageKey(key)];
  if(url){ window.location.href = url; }
  else toast('Falta la URL de «'+key+'» en config.json (nav). Luego ejecuta build.ps1.');
}

function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows;
}

const cache = {};
function sheet(tab){
  if(!CFG.sheetId) return Promise.reject(new Error('sin sheetId'));
  if(cache[tab]) return cache[tab];
  const url = `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
  return cache[tab] = fetch(url).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text() })
    .then(t=>{
      const rows = parseCSV(t).filter(r=>r.some(x=>x.trim()!==''));
      if(!rows.length) return {head:[],rows:[]};
      return {head:rows[0].map(h=>h.trim()), rows:rows.slice(1)};
    });
}
const asObjects = d => d.rows.map(r=>Object.fromEntries(d.head.map((h,i)=>[norm(h),r[i]??''])));

function cardHTML(s, d){
  const pct = Math.max(0,Math.min(100,Number(d.porcentaje)||0));
  const R=30, C=2*Math.PI*R;
  return `<a class="card" href="#" data-go="${s.k}" style="--c:${s.c}">
    <div class="top"><span class="ico">${svgIcon(s.ic)}</span><h3>${esc(s.t)}</h3><span class="chev">›</span></div>
    <div class="kpi">
      <div class="ring"><svg viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="${R}"/><circle class="fg" cx="37" cy="37" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-pct/100)}"/></svg><b>${pct}%</b></div>
      <div><div class="n">${esc(d.cifra)}</div><div class="d">${esc(d.descripcion)}</div></div>
    </div>
    <div class="cta">${esc(s.cta)} →</div>
  </a>`;
}
function animateRings(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>

}

async function renderSection(key){
  const s = SECTIONS.find(x=>x.k===key);

  const d = res.find(r=>norm(r.clave)===key) || {porcentaje:0,cifra:'–',descripcion:'Sin datos'};
  $('#cards').innerHTML = `<div class="single">${cardHTML(s,d).replace('href="#" data-go="'+key+'"','')}</div>`;
  animateRings();

  let html='';
  try{
    const t = await sheet(CFG.tabs[key]);
    if(!t.rows.length) throw new Error('vacía');
    html = `<div class="panel"><div class="tools"><input type="search" id="flt" placeholder="Filtrar ${esc(s.t.toLowerCase())}…"><span id="cnt"></span></div>
      <div class="tw"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody id="tb">${t.rows.map(r=>`<tr>${t.head.map((_,i)=>`<td>${linkify(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
    $('#inner').innerHTML = html;
    const cnt=()=>$('#cnt').textContent = [...$('#tb').rows].filter(r=>!r.hidden).length+' registros';
    cnt();
    $('#flt').oninput = e=>{ const q=norm(e.target.value); [...$('#tb').rows].forEach(r=>r.hidden = q && !norm(r.textContent).includes(q)); cnt(); };
  }catch(e){

  }
}
function linkify(v){
  const e = esc(v);
  return /^https?:\/\//.test(v.trim()) ? `<a href="${e}" target="_blank" rel="noopener" style="color:#1f5fbf;font-weight:600">Abrir</a>` : e;
}

let index = null;
async function buildIndex(){
  if(index) return index;
  index = SECTIONS.map(s=>({sec:s.k,title:s.t,text:'sección '+s.t,tit:true}));
  index.push({sec:'inicio',title:'Inicio',text:'inicio plataforma modernización estado actual',tit:true});
  const keys = [...SECTIONS.map(s=>s.k),'proyectos'];
  const out = await Promise.allSettled(keys.map(k=>sheet(CFG.tabs[k])));
  out.forEach((o,i)=>{
    if(o.status!=='fulfilled') return;
    const k = keys[i];
    o.value.rows.forEach(r=>index.push({sec:k==='proyectos'?'inicio':k, title:r[0]||'(sin título)', text:r.join(' · '), group:k}));
  });
  return index;
}
function openSearch(){ $('#ov').classList.add('on'); $('#q').focus(); buildIndex(); runSearch(); }
function closeSearch(){ $('#ov').classList.remove('on'); }
async function runSearch(){
  const q = norm($('#q').value.trim()), ul = $('#res');
  if(q.length<2){ ul.innerHTML='<div class="em">Escribe al menos 2 letras para buscar en normativa, procesos, simplificación, organización, innovación, servicios y proyectos.</div>'; return; }
  const idx = await buildIndex();
  const hits = idx.filter(x=>norm(x.title+' '+x.text).includes(q)).slice(0,30);
  const hl = s => { const e=esc(s), i=norm(e).indexOf(q); return i<0?e:e.slice(0,i)+'<mark>'+e.slice(i,i+q.length)+'</mark>'+e.slice(i+q.length); };
  ul.innerHTML = hits.length ? hits.map(h=>{
      const lab = (SECTIONS.find(s=>s.k===h.sec)||{t:'Inicio'}).t;
      return `<li><a href="#" data-go="${h.sec}"><b>${hl(h.title)}</b><span>${esc(lab)}${h.tit?'':' · '+hl(h.text.slice(0,110))}</span></a></li>`;
    }).join('') : '<div class="em">Sin resultados para «'+esc($('#q').value)+'».</div>';
}

,"arts":[{"n":1,"t":"Naturaleza Jurídica","c":"","b":["La Universidad Nacional de Ingeniería, en adelante UNI, es una persona jurídica de derecho público, creada por Ley N° 12379, con sede en la Provincia de Lima, Departamento de Lima, goza de autonomía normativa, de gobierno, académica, económica y administrativa, la cual se ejerce en el marco de la Constitución, la Ley Universitaria, y demás leyes y normas aplicables."]},{"n":2,"t":"Jurisdicción","c":"","b":["El ámbito territorial de la Universidad Nacional de Ingeniería sobre el que ejerce sus competencias es el distrito del Rímac, Provincia de Lima, Departamento de Lima y, fuera de ella, en el Perú, según sus influencias académicas y de investigación."]},{"n":3,"t":"Funciones Generales de la UNI","c":"","b":["Son funciones generales de la Universidad Nacional de Ingeniería:","Formar profesionalmente a sus estudiantes.","Promover e impulsar la investigación en sus diferentes formas.","Fortalecer la extensión cultural y proyección social.","Promover la educación continua.","Contribuir al desarrollo humano y desarrollo sostenible.","Realizar las demás funciones que le señala la Constitución Política del Perú, la Ley Universitaria, su Estatuto y normas conexas."]},{"n":4,"t":"Base Legal","c":"","b":["La Universidad Nacional de Ingeniería se rige por:","Constitución Política del Perú.","Ley N° 28044, Ley General de Educación, de fecha 29 de julio de 2003.","Ley N° 30220, Ley Universitaria, de fecha 9 de julio de 2014.","Ley N° 12379, Ley que crea la Universidad Nacional de Ingeniería, del 01 de agosto de 1955.","Ley N° 30057, Ley del Servicio Civil, del 04 de julio de 2013.","Ley N° 27806, Ley de Transparencia y Acceso a la Información Pública, del 03 de agosto de 2002.","Ley N° 27815 – Ley del Código de Ética de la función pública, del 13 de agosto de 2002","Ley N° 27785 – Ley Orgánica del Sistema Nacional de Control y de la Contraloría General de la República, del 23 de julio de 2002. .","Ley N° 27658 – Ley Marco de Modernización de la Gestión del Estado y sus modificatorias","Decreto Legislativo N° 1442, Decreto Legislativo de la Gestión Fiscal de los Recursos Humanos en el Sector Público, del 16 de setiembre de 2018.","Decreto Legislativo Nº 1438, Decreto Legislativo del Sistema Nacional de Contabilidad, del 16 de setiembre de 2018","Decreto Legislativo Nº 1439, Decreto Legislativo del Sistema Nacional de Abastecimiento, del 16 de setiembre de 2018.","Decreto Legislativo Nº 1440, Decreto Legislativo del Sistema Nacional de Presupuesto Público, del 16 de setiembre de 2018","Decreto Legislativo Nº 1441, Decreto Legislativo del Sistema Nacional de Tesorería, del 16 de setiembre de 2018.","Decreto Legislativo Nº 1252, Decreto Legislativo que crea el Sistema Nacional de Programación Multianual y Gestión de Inversiones y deroga la Ley Nº 27293, Ley del Sistema Nacional de Inversión Pública, 01 de diciembre de 2016.","Decreto Supremo N° 040-2014-PCM, que aprueba el Reglamento General de la Ley N° 30057, Ley del Servicio Civil, del 13 de junio de 2014.","Decreto Supremo Nº 054-2018-PCM, Decreto Supremo que aprueba los “Lineamientos de Organización del Estado”, del 18 de mayo de 2018.","Decreto Supremo Nº 064-2021-PCM, Decreto Supremo que modifica los “Lineamientos de Organización del Estado” aprobado mediante el Decreto Supremo N° 054-2018-PCM, del 06 de abril de 2021.","Decreto Supremo Nº 131-2018-PCM, Decreto Supremo que modifica los “Lineamientos de Organización del Estado” aprobados mediante el Decreto Supremo Nº 054-2018-PCM, del 30 de diciembre de 2018.","Decreto Supremo N° 123-2018-PCM, que aprueba el Reglamento del Sistema Administrativo de Modernización de la Gestión Pública.","Decreto Supremo N° 021-2019-JUS, que aprueba el Texto Único Ordenado de la Ley N° 27806, Ley de Transparencia y Acceso a la Información Pública, del 11 de diciembre de 2019.","Resolución de Secretaría de Gestión Pública N° 010-2021-PCM/SGP, que aprueba la Directiva N° 002-2021-SGP, Directiva que regula el sustento técnico y legal de proyectos normativos en materia de organización, estructura y funcionamiento del Estado, actualizada mediante Resolución de Secretaría de Gestión Pública N° 005-2025-PCM de fecha 17 de junio de 2025.","Resolución de Secretaría de Gestión Pública N° 002-2020-PCM/SGP, que aprueba los Lineamientos N° 01-2020-SGP denominados “Funciones estandarizadas en el marco de los sistemas administrativos”, del 22 de mayo de 2020.","Resolución de la Secretaría de Gestión Pública N° 004-2019-PCM/SGP, que aprueba los Lineamientos N° 001-2019-SGP “Principios de actuación para la Modernización de la Gestión Pública” y sus modificatorias, del 28 de febrero de 2019.","Resolución de Secretaría de Gestión Pública Nº 005-2020-PCM/SGP, que aprueba los Lineamientos N° 02-2020-SGP que establecen orientaciones sobre el Reglamento de Organización y Funciones - ROF y el Manual de Operaciones – MOP, del 20 de setiembre de 2020.","Resolución del Consejo Directivo N° 006-2015-SUNEDU/CD, que aprueba el “Modelo de Licenciamiento y su implementación en el Sistema Universitario Peruano”, del 24 de noviembre de 2015.","Resolución Rectoral N° 1787-2014-UNI, que publica el Estatuto de la Universidad Nacional de Ingeniería, del 16 de diciembre de 2014.","Las referidas normas comprenden, de corresponder, sus disposiciones ampliatorias, modificatorias y conexas.","TÍTULO II","DE LA ESTRUCTURA ORGÁNICA Y FUNCIONES DE LOS ÓRGANOS Y UNIDADES","ESTRUCTURA ORGÁNICA"]},{"n":5,"t":"Estructura Orgánica","c":"CAPÍTULO I","b":["La estructura orgánica de la Universidad Nacional de Ingeniería es la siguiente:","Órganos de Alta Dirección","Asamblea Universitaria","Consejo Universitario","Rectorado","Vicerrectorado Académico","Vicerrectorado de Investigación","Órganos Especiales","Defensoría Universitaria","Tribunal de Honor Universitario","Comisión Permanente de Fiscalización","Órgano de Control Institucional","Órgano de Control Institucional","Administración Interna: Órganos de Asesoramiento","Oficina de Asesoría Jurídica","Oficina de Planeamiento y Presupuesto","Unidad de Planeamiento y Presupuesto","Unidad de Modernización","Unidad Formuladora","Oficina de Gestión de la Calidad","Oficina de Cooperación y Relaciones Internacionales","Unidad de Internacionalización","Oficina de Comunicación e Imagen Institucional","Administración Interna: Órganos de Apoyo","Secretaría General","Dirección General de Administración","Unidad de Recursos Humanos","Unidad de Abastecimiento","Unidad de Tesorería y Contabilidad","Unidad Ejecutora de Inversiones","Unidad de Servicios Generales","Oficina de Tecnologías de la Información","Órganos de Línea","Consejo de Facultad","Decanato","Departamento Académico","Escuela Profesional","Unidad de Investigación","Unidad de Posgrado","Unidad de Servicios de Facultad","Unidad de Servicios de Apoyo Académico","Órganos Dependientes del Rectorado","Escuela de Posgrado","Dirección de Bienestar Universitario","Unidad de Centro Médico","Unidad de Centro de Disciplinas Deportivas","Dirección de Responsabilidad Social y Desarrollo Sostenible","Unidad de Desarrollo Sostenible","Unidad de Servicios de Extensión","Unidad de Centro Cultural UNI","Unidad de Fondo Editorial","Órganos Dependientes del Vicerrectorado Académico","Dirección de Biblioteca Central","Dirección de Registro Central y Estadística","Dirección de Admisión","Unidad de Centro Pre Universitario","Órganos Dependientes del Vicerrectorado de Investigación","Dirección de Innovación y Transferencia Tecnológica","06.09.1 Unidad de Incubadora de Empresas","06.09.2 Unidad de Innovación y Transferencia Tecnológica","Dirección de Gestión de la Investigación","Instituto de Investigación","Unidad de Laboratorio Nacional de Hidráulica","Centro Peruano Japonés de Investigaciones Sísmicas y Mitigación de Desastres","Unidad de Publicación e Indexación de Revistas Científicas","07. Órgano Desconcentrado","07.1 Instituto Nacional de Investigación y Capacitación de Telecomunicaciones","01. ÓRGANOS DE ALTA DIRECCIÓN"]},{"n":6,"t":"Órganos de Alta Dirección","c":"CAPÍTULO II","b":["Los órganos de la Alta Dirección de la Universidad Nacional de Ingeniería están integrados por:","Asamblea Universitaria","Consejo Universitario","Rectorado","Vicerrectorado Académico","Vicerrectorado de Investigación"]},{"n":7,"t":"Asamblea Universitaria","c":"CAPÍTULO II","b":["La Asamblea Universitaria es el máximo órgano de gobierno de la Universidad y representante de la comunidad universitaria; se encarga de dictar las políticas generales de la Universidad. Su composición y funcionamiento están previstos en la Ley Universitaria y en el Estatuto de la Universidad."]},{"n":8,"t":"Funciones de la Asamblea Universitaria","c":"CAPÍTULO II","b":["Aprobar las políticas de desarrollo universitario.","Reformar el Estatuto de la Universidad con la aprobación de por lo menos dos tercios del número de miembros, y remitir el nuevo Estatuto a la SUNEDU.","Velar por el adecuado cumplimiento de los instrumentos de gestión de la Universidad, aprobados por el Consejo Universitario.","Declarar la revocatoria y vacancia del Rector, los Vicerrectores y Decanos, de acuerdo con las causales expresamente señaladas en la Ley Universitaria, en el Estatuto de la UNI, y a través de una votación calificada de dos tercios (2/3) del número de miembros.","Elegir a los integrantes del Comité Electoral Universitario y del Tribunal de Honor Universitario; personas de reconocida trayectoria académica, profesional y ética en la Universidad.","Designar anualmente entre sus miembros a los integrantes de la Comisión Permanente encargada de fiscalizar la gestión de la Universidad. Los resultados de dicha fiscalización se informan a la Contraloría General de la República y a la SUNEDU.","Evaluar y aprobar la Memoria Anual, el Informe Semestral de Gestión del Rector y el Informe de Rendición de Cuentas del Presupuesto Anual Ejecutado.","Acordar la constitución, fusión, reorganización, separación y supresión de Facultades, Escuelas y Unidades de Posgrado, Escuelas Profesionales, Departamentos Académicos, Centros e Institutos, previo informe técnico debidamente sustentado, con su respectivo análisis costo-beneficio.","Declarar en receso temporal a la Universidad o a cualquiera de sus unidades académicas, cuando las circunstancias lo requieran, con cargo a informar a la Superintendencia Nacional de Educación Superior Universitaria - SUNEDU.","Realizar las demás funciones que le otorgan la Ley y el Estatuto de la UNI."]},{"n":9,"t":"Consejo Universitario","c":"CAPÍTULO II","b":["El Consejo Universitario es el órgano de Alta Dirección responsable de la gestión, dirección y ejecución académica y administrativa de la UNI."]},{"n":10,"t":"Funciones del Consejo Universitario","c":"CAPÍTULO II","b":["Aprobar, a propuesta del Rector, los instrumentos de gestión de la Universidad.","Dictar el Reglamento General de la Universidad, el Reglamento de Elecciones y otros reglamentos internos específicos, así como vigilar su cumplimiento.","Aprobar el Presupuesto General de la Universidad, el Plan Anual de Adquisiciones de Bienes y Servicios, autorizar los actos y contratos que atañen a la Universidad y resolver todo lo pertinente a su economía.","Proponer a la Asamblea Universitaria la creación, fusión, supresión o reorganización de unidades académicas e institutos de investigación; sustentados mediante informe técnico con su respectivo análisis costo-beneficio.","Concordar y ratificar los planes de estudios y de trabajo propuestos por las unidades académicas.","Designar, a propuesta del Rector, al Director General de Administración y al Secretario General; con sujeción a los perfiles especializados que previamente apruebe el Consejo Universitario. Ningún miembro de la Asamblea Universitaria, del Comité Electoral Universitario y del Tribunal de Honor Universitario puede ser Director General de Administración ni Secretario General.","Nombrar, contratar, ratificar, promover y remover a los docentes, a propuesta, en su caso, de las respectivas Facultades o de la Escuela de Posgrado.","Nombrar, contratar, promover y remover al personal administrativo, a propuesta de la respectiva Facultad o unidad administrativa concernida.","Conferir los grados académicos y los títulos profesionales aprobados por las Facultades y Escuela de Posgrado, así como otorgar distinciones honoríficas, reconocer y revalidar los estudios, grados y títulos de universidades extranjeras, en concordancia con las disposiciones de la Superintendencia Nacional de Educación Superior Universitaria.","Aprobar las modalidades de ingreso e incorporación a la Universidad. Asimismo, señalar anualmente el número de vacantes para el proceso ordinario de admisión, previa propuesta de las Facultades, en concordancia con el Presupuesto y el Plan de Desarrollo de la Universidad.","Ejercer en instancia revisora, el poder disciplinario sobre los docentes, estudiantes y personal administrativo, en la forma y grado que lo determinen los reglamentos.","Celebrar convenios con universidades extranjeras, organismos gubernamentales, internacionales u otros sobre investigación científica y tecnológica, así como otros asuntos relacionados con las actividades de la Universidad. Asimismo, hacer seguimiento, evaluación y rendición de cuentas a la Asamblea Universitaria por los convenios suscritos.","Conocer y resolver todos los demás asuntos que no están encomendados a otras autoridades universitarias.","Realizar otras funciones que señale el Estatuto de la UNI."]},{"n":11,"t":"Rectorado","c":"CAPÍTULO II","b":["Es el órgano de Alta Dirección responsable de la dirección, conducción y gestión del gobierno universitario en todos sus ámbitos, dentro de los límites de la Ley Universitaria y del Estatuto de la UNI."]},{"n":12,"t":"Funciones del Rectorado","c":"CAPÍTULO II","b":["Presidir el Consejo Universitario y la Asamblea Universitaria, así como hacer cumplir sus acuerdos.","Dirigir la actividad académica de la Universidad y su gestión administrativa, económica y financiera, apoyado en órganos competentes.","Presentar al Consejo Universitario, para su aprobación, los instrumentos de gestión institucional de la Universidad.","Refrendar los diplomas de grados académicos y títulos profesionales, así como las distinciones universitarias conferidas por el Consejo Universitario.","Expedir las Resoluciones de carácter previsional del personal docente y administrativo de la Universidad.","Presentar a la Asamblea Universitaria la Memoria Anual, el Informe Semestral de Gestión del Rector y el Informe de Rendición de Cuentas del Presupuesto Anual Ejecutado.","Transparentar la información económica y financiera de la Universidad.","Realizar las demás funciones que le otorguen la Ley Universitaria y el Estatuto de la UNI."]},{"n":13,"t":"Vicerrectorado Académico","c":"CAPÍTULO II","b":["Es el órgano de Alta Dirección dependiente del Rectorado, responsable de la dirección y ejecución de la política general de formación académica, de normar, regular, supervisar y evaluar las actividades académicas de pregrado, la función docente, las cátedras y los diferentes proyectos y programas académicos institucionales, apoyado por los órganos de naturaleza académica de la UNI."]},{"n":14,"t":"Funciones del Vicerrectorado Académico","c":"CAPÍTULO II","b":["Considerando sus áreas de competencia, y en concordancia con las directivas impartidas por el Rector:","Dirigir y ejecutar la política general de formación académica en la Universidad, así como conducir la formulación, actualización e implementación del Modelo Educativo Institucional, en coordinación con las Facultades.","Supervisar las actividades académicas con la finalidad de garantizar la calidad de estas y su concordancia con la misión y metas establecidas por el Estatuto de la Universidad y demás disposiciones normativas internas.","Dirigir y promover la capacitación permanente del personal docente de la Universidad.","Supervisar el adecuado cumplimiento de los planes de estudio de formación académica en la Universidad, así como sus respectivas actualizaciones.","Promover la creación de nuevas especialidades según las tendencias y necesidades futuras del país.","Promover la internacionalización académica de la Universidad a través del intercambio de docentes y estudiantes, así como gestionar la visita de profesores extranjeros, profesionales invitados y convenios para otorgar doble grado académico.","Planear, organizar, dirigir y controlar, conjuntamente con las Facultades, las actividades académicas de la Universidad.","Representar a la Universidad ante los organismos encargados de elaborar la política educacional y que corresponden a su ámbito.","Promover en favor de los estudiantes y egresados la Bolsa de Trabajo de la Universidad Nacional de Ingeniería.","Constituir una instancia de coordinación de dirección y planeamiento, conformada por los órganos que estén a su cargo, garantizando su adecuado funcionamiento.","Promover la vinculación de los estudiantes y egresados con el sector empleador, orientadas al fortalecimiento de su empleabilidad, en coordinación con las unidades de organización competentes.","Realizar otras funciones que le confieren la Ley, el Estatuto, y las que le asigne el Consejo Universitario y/o el Rectorado."]},{"n":15,"t":"Vicerrectorado de Investigación","c":"CAPÍTULO II","b":["Es el órgano de Alta Dirección dependiente del Rectorado, responsable de la dirección, orientación y ejecución de actividades principales y sustantivas referidas al ámbito de la investigación de la UNI, así como organizar la difusión del conocimiento y promover la aplicación de los resultados de las investigaciones, la transferencia tecnológica y el uso de las fuentes de investigación, a los sectores sociales, empresas y entidades del Estado."]},{"n":16,"t":"Funciones del Vicerrectorado de Investigación","c":"CAPÍTULO II","b":["Considerando sus áreas de competencia, y en concordancia con las directivas impartidas por el Rector:","Dirigir y ejecutar la política general de investigación, desarrollo de tecnología y transferencia tecnológica de la Universidad.","Supervisar las actividades de investigación, desarrollo de tecnología y transferencia tecnológica con la finalidad de garantizar la calidad de las mismas y su concordancia con la misión y metas establecidas por el Estatuto de la Universidad.","Organizar la difusión del conocimiento y los resultados de las investigaciones.","Coordinar e implementar acciones vinculadas a la identificación, seguimiento y documentación de la gestión del conocimiento.","Gestionar el financiamiento de la investigación y el desarrollo de tecnología ante las entidades y organismos públicos o privados.","Promover la generación de recursos para la Universidad a través de la producción de bienes y prestación de servicios derivados de las actividades de investigación y desarrollo de tecnología, así como mediante la obtención de regalías por patentes u otros derechos de propiedad intelectual.","Promover las publicaciones científicas, así como reconocer los mejores trabajos de investigación e innovación.","Establecer redes de investigación, relaciones de cooperación con universidades e institutos nacionales e internacionales, para el desarrollo de investigaciones conjuntas.","Representar a la Universidad ante los organismos encargados de elaborar la política de investigación y que corresponden a su ámbito.","Realizar otras funciones que le confiere la Ley, el Estatuto; y las que le asigne el Consejo Universitario y/o el Rectorado.","02. ÓRGANOS ESPECIALES"]},{"n":17,"t":"Órganos Especiales","c":"CAPÍTULO III","b":["Constituyen Órganos Especiales de la UNI los siguientes:","02.1Defensoría Universitaria.","02.2Tribunal de Honor Universitario","02.3Comisión Permanente de Fiscalización."]},{"n":18,"t":"Defensoría Universitaria","c":"CAPÍTULO III","b":["Es el órgano especial responsable de la tutela de los derechos de los miembros de la comunidad universitaria y de velar por el mantenimiento del principio de autoridad responsable. Es competente para conocer las denuncias y reclamaciones que formulen los miembros de la comunidad universitaria vinculadas con la infracción de derechos individuales. El Estatuto de la Universidad establece los mecanismos de regulación y funcionamiento de la Defensoría. No forman parte de la competencia de la Defensoría las denuncias vinculadas con derechos de carácter colectivo, derechos laborales, medidas disciplinarias, evaluaciones académicas de docentes y alumnos y las violaciones que puedan impugnarse por otras vías ya establecidas en la Ley Universitaria, así como en el Estatuto y Reglamentos de la UNI."]},{"n":19,"t":"Funciones de la Defensoría Universitaria","c":"CAPÍTULO III","b":["Velar por el respeto de los derechos y las libertades de todos los miembros de la comunidad universitaria frente a actos u omisiones de las autoridades, funcionarios, docentes y trabajadores no docentes de la Universidad que los vulneren.","Promover, orientar y difundir en la comunidad universitaria el respeto y tutela de los Derechos Humanos.","Conocer y atender las denuncias y reclamaciones que formulen los miembros de la comunidad universitaria vinculadas con la infracción de derechos y libertades individuales.","Conciliar en la solución de desacuerdos y diferencias entre miembros de la comunidad universitaria, a instancia de parte o por petición de los órganos de gobierno de la UNI.","Proponer políticas y normas que contribuyan a garantizar y mejorar la defensa de los derechos de las personas de la comunidad universitaria.","Formular recomendaciones a los órganos responsables del gobierno de la Universidad sobre asuntos de violación de derechos que hayan sido sometidos a su conocimiento.","Presentar al Consejo Universitario un Informe Anual sobre el desarrollo de sus actividades o cuando este se lo solicite.","Formular y elevar el Reglamento Interno de la Defensoría Universitaria para su aprobación.","Realizar otras funciones conforme a la Ley Universitaria, el Estatuto, y las establecidas en los Reglamentos y normas especiales, dentro del ámbito de su competencia."]},{"n":20,"t":"Tribunal de Honor Universitario","c":"CAPÍTULO III","b":["Es el órgano especial responsable de emitir juicios de valor sobre toda cuestión ética en la que estuviera involucrado algún docente y/o estudiante de la Universidad y propone, según el caso, las sanciones correspondientes al Consejo Universitario."]},{"n":21,"t":"Funciones del Tribunal de Honor Universitario","c":"CAPÍTULO III","b":["Emitir juicios de valor sobre toda cuestión ética, en la que estuviera involucrado algún miembro de la comunidad universitaria.","Elevar al Consejo Universitario la calificación de la investigación administrativa disciplinaria de docentes y estudiantes, con las recomendaciones para su implementación; lo que, previo análisis, resolverá de conformidad con la Ley.","Proponer, según el caso, las sanciones correspondientes al Consejo Universitario.","Emitir juicios de valor, debidamente motivados y sustentados, sobre toda cuestión ética, en la que estuviera involucrado algún docente y estudiante de la Universidad.","Analizar de manera imparcial y de acuerdo con las normas que le sean aplicables aquellos casos que ponga a su consideración el presidente del THU.","Elevar al Consejo Universitario la calificación de la falta en el procedimiento disciplinario administrativo a los docentes y estudiantes, con las recomendaciones para su implementación; lo que, previo análisis, resolverá de conformidad con la Ley.","Proponer al Consejo Universitario las sanciones que le corresponden al investigado, de ser el caso.","Realizar otras funciones establecidas en la Ley Universitaria, el Estatuto y normas internas."]},{"n":22,"t":"Comisión Permanente de Fiscalización","c":"CAPÍTULO III","b":["Es el órgano especial responsable de vigilar la gestión académica, administrativa y económica de la UNI. Está integrada por dos docentes, un estudiante de pregrado y un estudiante de posgrado, miembros de la Asamblea Universitaria. Cuenta con amplias facultades para solicitar información a toda instancia interna de la Universidad. Está obligada a guardar la debida confidencialidad de la información proporcionada, bajo responsabilidad."]},{"n":23,"t":"Funciones de la Comisión Permanente de Fiscalización","c":"CAPÍTULO III","b":["Vigilar la gestión académica, de investigación, administrativa y económica de la UNI.","Solicitar información a toda instancia interna de la UNI para la verificación de la gestión institucional.","Emitir Informe Técnico Legal respecto a la fiscalización de la gestión institucional, formular las recomendaciones y proponer medidas correctivas.","Guardar la debida confidencialidad de la información proporcionada, bajo responsabilidad.","Proponer a la Asamblea Universitaria, para su aprobación, el Reglamento Interno de la Comisión Permanente de Fiscalización.","Realizar otras funciones que establezca la Ley Universitaria, el Estatuto y las que le asigne la Asamblea Universitaria, dentro del ámbito de su competencia.","03. ÓRGANO DE CONTROL INSTITUCIONAL"]},{"n":24,"t":"Órgano de Control Institucional","c":"CAPÍTULO IV","b":["El Órgano de Control Institucional (OCI) es el órgano que realiza el control gubernamental en la Universidad, es conformante del Sistema Nacional de Control y depende funcional y administrativamente de la Contraloría General de la República. Sin perjuicio de ello, hace de conocimiento del Titular de la Entidad sus requerimientos y resultados de las acciones y actividades del control realizadas. Asimismo, informa los resultados de sus labores de control, inherentes a su ámbito de competencia."]},{"n":25,"t":"Funciones del Órgano de Control Institucional","c":"CAPÍTULO IV","b":["Formular en coordinación con las unidades orgánicas competentes de la Contraloría, el Plan Anual de Control, de acuerdo con las disposiciones que sobre la materia emita la Contraloría.","Formular y remitir para aprobación del órgano desconcentrado o de la unidad orgánica a cuyo ámbito de control pertenece, la propuesta de la carpeta de servicio correspondiente al servicio de control posterior a ser realizado, de acuerdo a los lineamientos y normativa aplicable.","Comunicar al Titular de la entidad bajo su ámbito de control, el inicio de los servicios de control gubernamental. Cuando se trate de servicios de control gubernamental a realizarse en entidades que no corresponden al ámbito de control del OCI, la comisión de control es acreditada ante el Titular de la entidad, por la Vicecontraloría, la Gerencia Regional de Control o la Subgerencia de Control, según corresponda.","Ejercer el control gubernamental conforme a las disposiciones establecidas en la Ley, las Normas Generales de Control Gubernamental y demás normativas emitidas por la Contraloría.","Formular, aprobar y notificar a la entidad, los informes resultantes de los servicios de control gubernamental. El OCI, según las disposiciones aplicables vigentes, remite a la unidad orgánica o al órgano desconcentrado de la Contraloría del cual depende, el informe de control para su aprobación. Asimismo, cuando la Vicecontraloría, la Gerencia Regional de Control o la Subgerencia de Control lo disponga, el OCI remite a dichos órganos o unidad orgánica, según corresponda, el informe de control aprobado para su notificación a la entidad.","Elaborar la Carpeta de Control y remitirla al órgano desconcentrado o a la unidad orgánica de la Contraloría a cuyo ámbito de control pertenece el OCI, para su comunicación al Ministerio Público, conforme a las disposiciones emitidas por la Contraloría.","Recibir y atender, o de corresponder, derivar las denuncias que presenten las personas naturales o jurídicas, de acuerdo a la normativa aplicable.","Realizar los servicios de control gubernamental respecto a las denuncias evaluadas que les sean derivadas, de acuerdo a los lineamientos y normativa aplicable.","Efectuar el seguimiento a la implementación de las recomendaciones, así como de las acciones preventivas o correctivas que adopte la Entidad, a partir de los informes resultantes de los servicios de control, conforme a la normativa específica que para tal efecto emite la Contraloría.","Realizar el registro oportuno en los sistemas informáticos establecidos por la Contraloría, de la información sobre los avances de los servicios de control gubernamental a su cargo, así como de los informes resultantes de dichos servicios.","Analizar las solicitudes de servicios de control gubernamental, que incluyen pedidos de información presentados por el Congreso de la República, de acuerdo a los lineamientos y normativa aplicable.","Apoyar a las comisiones auditoras, comisiones de control, equipos o personal que designe la Contraloría para la realización de los servicios de control gubernamental en la Entidad en la cual se encuentra el OCI, de acuerdo a la disponibilidad de su capacidad operativa.","Realizar las acciones que disponga la Contraloría respecto a la implementación del Sistema de Control Interno en la Entidad, de acuerdo a la normativa aplicable.","Coadyuvar con la ejecución de las actividades de audiencias públicas y participación ciudadana desarrolladas en su ámbito de competencia.","Cumplir con los encargos asignados en normas con rango de ley o normas de ámbito nacional con rango o fuerza de ley, así como los asignados en los reglamentos, directivas, manuales, procedimientos y demás normativas emitidas por la Contraloría.","Cumplir diligente y oportunamente con los encargos y requerimientos que le formule la Contraloría.","Mantener ordenados, custodiados y a disposición de la Contraloría durante diez (10) años los informes resultantes de los servicios de control gubernamental, documentación de control o papeles de trabajo, denuncias recibidas y en general toda documentación relativa a las funciones del OCI, luego de los cuales quedan sujetos a las normas de archivo vigente para el sector público.","Remitir a la Contraloría el acervo documentario del OCI respecto a los servicios de control gubernamental, en caso se desactive o extinga la Universidad Nacional de Ingeniería.","Mantener en reserva y confidencialidad la información y resultados obtenidos en el ejercicio de sus funciones.","Realizar otras funciones que establezca la Contraloría General de la República.","04. ADMINISTRACIÓN INTERNA: ÓRGANOS DE ASESORAMIENTO"]},{"n":26,"t":"Administración Interna: Órganos de Asesoramiento","c":"CAPÍTULO V","b":["Constituyen Órganos de Asesoramiento de la UNI los siguientes:","04.1Oficina de Asesoría Jurídica.","04.2Oficina de Planeamiento y Presupuesto.","04.2.1 Unidad de Planeamiento y Presupuesto.","04.2.2 Unidad de Modernización.","04.2.3 Unidad Formuladora.","04.3Oficina de Gestión de la Calidad.","04.4Oficina de Cooperación y Relaciones Internacionales.","04.5Oficina de Comunicación e Imagen Institucional."]},{"n":27,"t":"Oficina de Asesoría Jurídica","c":"CAPÍTULO V","b":["Es el órgano de asesoramiento dependiente del Rectorado responsable de brindar asesoramiento, emitir opinión y de absolver las consultas en asuntos de carácter jurídico-legal a la Alta Dirección y a las unidades de organización de la Universidad; así como desarrollar y ejecutar la defensa legal de los intereses y derechos de la Universidad."]},{"n":28,"t":"Funciones de la Oficina de Asesoría Jurídica","c":"CAPÍTULO V","b":["Asesorar a los Órganos de Gobierno, así como a la Alta Dirección, en temas de carácter jurídico-legal.","Proponer a la Alta Dirección las políticas de las acciones de carácter jurídico-legal.","Representar y ejercer la defensa de los intereses y derechos de la UNI en procesos conciliatorios, judiciales, arbitrales y administrativos, en los que intervenga, ya sea como demandante o demandado.","Revisar y emitir opinión legal en los convenios (Marco y/o Específico), que la Universidad Nacional de Ingeniería suscriba con Instituciones Públicas y/o Privadas, en coordinación con las unidades de organización pertinentes.","Brindar asistencia y emitir opinión jurídico-legal en asuntos administrativos y normativos en materia de contrataciones públicas y otros que se soliciten.","Elaborar los contratos en materia de Contratación Pública.","Absolver las consultas que formulen las unidades de organización en temas de índole jurídico-legal.","Emitir opinión jurídica sobre la aplicación y alcances de las normas lega les que solicite la Alta Dirección.","Formular los contratos de bienes y servicios que vinculen a la Universidad.","Emitir informes legales relacionados con: Recursos de Apelación, Ampliaciones de Plazo Contractual, Nulidades de Oficio, Procesos de Estandarización, Contratación Directa, Delegación de facultades, Ampliación de Crédito Presupuestal y el Inicio de Procedimiento Administrativo por incumplimiento contractual ante el Organismo Especializado para las Contrataciones Públicas Eficientes (OECE)","Brindar información de los procesos judiciales y/o arbitrales a las instancias correspondientes.","Recopilar y clasificar permanentemente los dispositivos legales, reglamentarios y administrativos referidos a la administración pública en general.","Proponer las modificaciones de las normas y reglamentos remitidos por los órganos que propicien su perfeccionamiento y/o actualización en observancia de la normatividad que le sea aplicable.","Realizar otras funciones en materia de su competencia que le asigne la Alta Dirección."]},{"n":29,"t":"Oficina de Planeamiento y Presupuesto","c":"CAPÍTULO V","b":["La Oficina de Planeamiento y Presupuesto es el órgano de asesoramiento del Rectorado responsable de la planificación institucional, así como de orientar, coordinar e integrar los procesos técnicos de planificación, presupuesto, estadística institucional, de gestión de la inversión pública y de formular documentos de gestión para el logro de objetivos, políticas y metas institucionales en el marco de lo dispuesto por los Sistemas Administrativos de Planeación, Presupuesto y Modernización, y la normatividad vigente.","Las unidades orgánicas de la Oficina de Planeamiento y Presupuesto son las siguientes:","Unidad de Planeamiento y Presupuesto","Unidad de Modernización","Unidad Formuladora"]},{"n":30,"t":"Funciones de la Oficina de Planeamiento y Presupuesto","c":"CAPÍTULO V","b":["Asesorar a los Órganos de la Alta Dirección en materia de planificación, presupuesto, estadística, inversiones y modernización.","Proponer los lineamientos de política, objetivos institucionales y planes de desarrollo de la Universidad para el corto, mediano y largo plazo en coordinación con los órganos correspondientes, en el marco de los Sistemas Administrativos de Presupuesto Público, Planeamiento Estratégico, Programación Multianual de Inversiones y Modernización.","Conducir y supervisar el proceso institucional de planeamiento estratégico y operativo, en concordancia con los objetivos y políticas institucionales, y en el marco de los objetivos de desarrollo nacional, de acuerdo con las directivas técnicas correspondientes.","Coordinar y dirigir la Programación y Formulación Multianual del Presupuesto Institucional con enfoque por resultado en coordinación con los Órganos de Dirección, de Gobierno y demás unidades de organización de la Universidad.","Efectuar la evaluación semestral y anual del presupuesto institucional, según directivas emitidas por el Ministerio de Economía y Finanzas, en coordinación con las unidades de organización respectivas.","Conducir el proceso de ejecución presupuestal en coordinación con las unidades de organización correspondientes.","Conducir la Programación Multianual de Inversiones (PMI) y supervisar la gestión institucional de la cartera de inversiones de la Universidad.","Coordinar y ejecutar la obtención de información y organización de datos para alimentar al Sistema Estadístico Institucional a ser utilizado para la planificación universitaria.","Formular la propuesta de adecuación del Reglamento de Organización y Funciones – ROF de la Universidad y del Informe Técnico que lo sustenta.","Conducir la elaboración y aprobación de la Memoria Anual institucional.","Realizar otras funciones en materia de su competencia que le asigne la Alta Dirección."]},{"n":31,"t":"Unidad de Planeamiento y Presupuesto","c":"CAPÍTULO V","b":["La Unidad de Planeamiento y Presupuesto es la unidad orgánica de asesoramiento dependiente de la Oficina de Planeamiento y Presupuesto responsable de ejecutar los procesos técnicos en materia de planeamiento institucional y presupuestal correspondientes a Planeamiento Estratégico y Presupuesto Público."]},{"n":32,"t":"Funciones de la Unidad de Planeamiento y Presupuesto","c":"CAPÍTULO V","b":["Implementar y ejecutar las normas, lineamientos, metodologías e instrumentos para la gestión de los procesos de planeamiento y presupuesto, conforme a las disposiciones normativas.","Gestionar técnicamente la formulación, seguimiento y evaluación de los instrumentos de planeamiento institucional.","Efectuar el monitoreo permanente del cumplimiento de los objetivos, acciones y metas programadas en el Plan Estratégico Institucional y Plan Operativo que contengan objetivos y metas institucionales, y retroalimentar el proceso de planeamiento.","Ejecutar y coordinar las fases del Proceso Presupuestario de la Entidad, sujetándose a las disposiciones del Sistema Nacional de Presupuesto Público y las que emita la Dirección General de Presupuesto Público.","Gestionar la programación multianual, formulación y aprobación del presupuesto institucional, asegurando que los Programas Presupuestales y la estructura presupuestaria guarden concordancia con las prioridades institucionales.","Brindar asesoramiento y orientación técnica a los órganos en la formulación y evaluación de los planes y programas en materia presupuestal y de planeamiento.","Consolidar la información sobre la ejecución de ingresos y gastos autorizados en el presupuesto y sus modificaciones.","Controlar e informar la ejecución de los ingresos y gastos presupuestados y sus modificatorias, así como coordinar con los órganos para el cumplimiento de las metas presupuestarias.","Emitir opinión sobre disponibilidad presupuestaria en la adquisición y contratación de bienes, servicios e inversiones.","Velar por el adecuado registro de la ejecución presupuestal de acuerdo a los lineamientos y disposiciones vigentes, a través de los aplicativos informáticos del Ministerio de Economía y Finanzas.","Evaluar los requerimientos solicitados de transferencias y ampliaciones presupuestales.","Velar por el cumplimiento y aplicación de las normas que regulan la programación, formulación y ejecución presupuestaria.","Coordinar con la Unidad Ejecutora de Inversiones, el seguimiento de los recursos transferidos a las inversiones.","Recopilar, consolidar, procesar y analizar la información estadística institucional.","Consolidar la información técnica requerida y formular la Memoria Anual de la Universidad.","Realizar las demás funciones que le asigne la Oficina de Planeamiento y Presupuesto en el ámbito de sus competencias y aquellas que le correspondan por norma expresa."]},{"n":33,"t":"Unidad de Modernización","c":"CAPÍTULO V","b":["La Unidad de Modernización es la unidad orgánica de asesoramiento dependiente de la Oficina de Planeamiento y Presupuesto responsable de diseñar, proponer y orientar acciones y procesos técnicos de modernización organizativa, organización institucional y simplificación administrativa orientados al incremento de eficiencia y eficacia de los procesos en la Universidad para el cumplimiento de los objetivos y metas institucionales."]},{"n":34,"t":"Funciones de la Unidad de Modernización","c":"CAPÍTULO V","b":["Asesorar y brindar asistencia técnica a las unidades de organización en diseño organizacional, gestión por procesos y simplificación administrativa, así como en la formulación y mejora de documentos normativos y otros instrumentos técnicos, en el marco del Sistema de Modernización de la Gestión Pública.","Emitir opinión técnica sobre las propuestas de documentos normativos enviadas por las unidades de organización para su aprobación, en el marco de la normatividad vigente.","Participar en la formulación y actualización de los documentos de gestión, así como proponer su modificación y mejora.","Promover propuestas orientadas al mejoramiento, a la adecuación sistemática de funciones, y de formulación e implementación de directivas y demás instrumentos de normatividad interna, en coordinación con las unidades de organización de la universidad de conformidad con las normas vigentes.","Proponer, promover y coordinar iniciativas que contribuyan al proceso de modernización institucional, en materia de simplificación administrativa y adecuación a la gestión por procesos, con la participación de las unidades de organización de la Universidad.","Coordinar y conducir los procesos de diseño, estructura y organización de la universidad, así como la formulación y actualización de los documentos de gestión en materia organizacional y de procedimientos administrativos TUPA en coordinación con las unidades de organización, en el marco de la normativa y disposiciones legales.","Conducir y articular la gestión de la innovación pública en la Universidad, mediante la evaluación de iniciativas, la emisión de opiniones técnicas, la gestión del portafolio institucional de innovación pública, así como la orientación y acompañamiento a las unidades de organización, conforme a la normativa vigente.","Coordinar e implementar acciones vinculadas a la identificación, seguimiento y documentación de la gestión del conocimiento","Realizar otras funciones en materia de su competencia que le asigne la Oficina de Planeamiento y Presupuesto."]},{"n":35,"t":"Unidad Formuladora","c":"CAPÍTULO V","b":["La Unidad Formuladora es la unidad orgánica de asesoramiento dependiente de la Oficina de Planeamiento y Presupuesto y sujeta al Sistema Nacional de Programación Multianual y Gestión de Inversiones, responsable de ejecutar y coordinar la fase de formulación y evaluación de los proyectos de inversión y las Inversiones de Optimización, de Ampliación Marginal, de Rehabilitación y de Reposición (IOARR) de la Universidad Nacional de Ingeniería, de acuerdo a las metodologías y parámetros técnicos del Sistema Nacional de Programación Multianual y Gestión de Inversiones (SNPMGI)  y disposiciones que le son aplicables."]},{"n":36,"t":"Funciones de la Unidad Formuladora","c":"CAPÍTULO V","b":["Participar en la Fase de Programación Multianual de Inversiones para la Priorización de la cartera de inversiones del PMI de la Universidad Nacional de Ingeniería, conforme al Sistema Nacional de Programación Multianual y Gestión de Inversiones.","Coordinar, orientar y brindar asistencia técnica a las unidades de organización de la UNI para la identificación de brechas y necesidades de inversión, formulando y evaluando proyectos de inversión e IOARR, verificando su alineamiento con la Programación Multianual de Inversiones, el Plan Estratégico Institucional, el Plan Director de la UNI y la normativa del Sistema Nacional de Programación Multianual y Gestión de Inversiones.","Formular y evaluar proyectos de inversión e inversiones de optimización, ampliación marginal, rehabilitación y reposición (IOARR), aplicando los contenidos, metodologías, parámetros y lineamientos técnicos aprobados por la Dirección General de Programación Multianual de Inversiones, así como las metodologías específicas y demás disposiciones emitidas por el Ministerio de Educación y la normativa vigente.","Elaborar los documentos técnicos requeridos para la formulación de proyectos de inversión e IOARR, considerando los objetivos, metas e indicadores establecidos en la Programación Multianual de Inversiones y en concordancia con la normativa del Sistema Nacional de Programación Multianual y Gestión de Inversiones.","Estimar y proyectar los fondos necesarios para la operación y mantenimiento (O\u0026M) de los activos derivados de la ejecución de los proyectos de inversión pública e IOARR de la Universidad, asegurando el cálculo de los costos incrementales y la sostenibilidad financiera del servicio educativo durante su horizonte de evaluación, en concordancia con las metodologías vigentes del Sistema Nacional de Programación Multianual y Gestión de Inversiones.","Coordinar y verificar con las unidades de organización competentes la identificación, evaluación y disponibilidad de las áreas de intervención previstas en el Plan Director de la UNI, verificando su viabilidad para la formulación de proyectos de inversión e IOARR y promoviendo las acciones necesarias cuando corresponda.","Coordinar, identificar, evaluar y mantener actualizada la información del estado situacional de las unidades productoras asociadas a los servicios de educación superior universitaria, así como sustentar técnicamente la creación, modificación, actualización o cierre de unidades productoras, en el marco del Sistema Nacional de Programación Multianual y Gestión de Inversiones y de los lineamientos emitidos por el Ministerio de Educación.","Brindar asistencia técnica durante el ciclo de inversión respecto de los aspectos de formulación y evaluación que correspondan a la Unidad Formuladora.","Registrar y actualizar en el Banco de Inversiones la información de los proyectos de inversión e inversiones de optimización, ampliación marginal, rehabilitación y reposición (IOARR), conforme a la normativa vigente y en el ámbito de sus competencias.","Evaluar los proyectos de inversión y emitir la declaración de viabilidad cuando corresponda, conforme a las competencias establecidas en el Sistema Nacional de Programación Multianual y Gestión de Inversiones.","Evaluar y aprobar según corresponda las inversiones de optimización, de ampliación marginal, de reposición y de rehabilitación (IOARR), conforme a la normativa vigente.","Solicitar opinión de la Oficina de Programación Multianual de Inversiones del Sector sobre los proyectos de inversión a ser financiados con fondos públicos provenientes de operaciones de endeudamiento, a fin de asegurar el alineamiento con los objetivos priorizados, metas e indicadores que contribuyan efectivamente al cierre de brechas de infraestructura o de acceso a servicios, de acuerdo a los criterios de priorización aprobados.","Verificar y aprobar la consistencia entre el resultado del expediente técnico o documento equivalente con el cual se va a ejecutar el proyecto de inversión y los documentos técnicos que sustentaron la declaración de viabilidad de los proyectos de inversión o la información actualizada en la fase de Ejecución, correspondiente a modificaciones antes de aprobar el expediente técnico o documento equivalente, en un plazo de diez (10) días hábiles a partir de recibida la solicitud, conforme a la normativa del Sistema Nacional de Programación Multianual y Gestión de Inversiones.","Solicitar la opinión favorable de la DGPMI sobre los proyectos o programas de inversión a ser financiados con fondos públicos provenientes de operaciones de endeudamiento externo del GN, previo a su declaración de viabilidad, cuya solicitud debe contener las opiniones de las OPMI correspondientes.","Solicitar la opinión favorable de la DGPMI respecto de los proyectos de inversión de alta complejidad; así como solicitar la opinión favorable a la OPMI del Sector funcionalmente responsable de los proyectos de inversión.","Desactivar las inversiones de la Universidad Nacional de Ingeniería, cuando corresponda, de acuerdo con los criterios y disposiciones establecidos por la Dirección General de Programación Multianual de Inversiones.","Evaluar y registrar, a solicitud de la Unidad Ejecutora de Inversiones y con el sustento correspondiente, las modificaciones de los proyectos y programas de inversión que se presenten con posterioridad a la declaración de viabilidad y antes de la aprobación del expediente técnico o documento equivalente, verificando que se mantengan el objetivo central, la concepción técnica, económica y el dimensionamiento de la inversión.","Registrar la actualización de los documentos técnicos que sustentaron la declaración de viabilidad de los proyectos de inversión cuando estos hayan perdido vigencia, conforme a las disposiciones del Sistema Nacional de Programación Multianual y Gestión de Inversiones.","Aplicar la metodología BIM en la fase de Formulación y Evaluación de las inversiones de la Universidad, cuando corresponda, de acuerdo con el Plan BIM Perú y las disposiciones emitidas en el marco del SNPMGI.","Registrar y mantener actualizada la información del equipo técnico de la Unidad Formuladora en los aplicativos informáticos del Sistema Nacional de Programación Multianual y Gestión de Inversiones.","Realizar las demás funciones que le sean asignadas por la Oficina de Planeamiento y Presupuesto, en el ámbito de sus competencias y aquellas que le correspondan por norma expresa."]},{"n":37,"t":"Oficina de Gestión de la Calidad","c":"CAPÍTULO V","b":["La Oficina de Gestión de la Calidad es el órgano de asesoramiento del Rectorado responsable de planificar, organizar, conducir, ejecutar y evaluar la implementación del Sistema de Gestión de la Calidad de la UNI, así como supervisar y evaluar el cumplimiento de los lineamientos y directivas de calidad universitaria, licenciamiento, renovación de licencia, acreditación y certificación, según los estándares académicos fijados por el sistema universitario nacional e internacional."]},{"n":38,"t":"Funciones de la Oficina de Gestión de la Calidad","c":"CAPÍTULO V","b":["Asesorar a la Alta Dirección en materia de calidad universitaria, licenciamiento, acreditación y certificación.","Formular y proponer políticas, lineamientos, directivas y manuales de calidad universitaria.","Diseñar e implementar el Sistema de Gestión de la Calidad en el marco de las normas ISO y demás normas nacionales e internacionales vigentes que le sean aplicables.","Dirigir, coordinar, supervisar y evaluar los programas, planes y actividades del Sistema de Gestión de la Calidad a nivel central y en las Facultades; así como los procesos de implementación de mejora continua, licenciamiento, re-licenciamiento, acreditación, re-acreditación y certificación nacional e internacional.","Diseñar e implementar el Sistema de Evaluación de la Calidad Universitaria a nivel de programas de estudios de pregrado y posgrado con fines de mejora, licenciamiento y acreditación.","Promover la acreditación de carreras de estudio.","Elaborar diagnósticos situacionales de calidad universitaria en la Universidad.","Promover la certificación de los procesos académicos y de los laboratorios de la UNI.","Fomentar la cultura de la mejora continua en la comunidad universitaria.","Promover, gestionar, implementar y evaluar proyectos de mejora de la calidad universitaria.","Diseñar, planificar, organizar, implementar y evaluar planes y actividades permanentes de sensibilización y capacitación que contribuyan a la mejora de la calidad universitaria.","Diseñar, implementar y difundir metodologías, herramientas e indicadores del Sistema de Gestión de la Calidad.","Informar a la Alta Dirección sobre el nivel de avance de la implementación del Sistema de Gestión de la Calidad.","Realizar otras funciones que le asigne la Alta Dirección dentro del ámbito de su competencia."]},{"n":39,"t":"Oficina de Cooperación y Relaciones Internacionales","c":"CAPÍTULO V","b":["La Oficina de Cooperación y Relaciones Internacionales es el órgano de asesoramiento dependiente del Rectorado responsable de ejecutar la política de relaciones internacionales de la Universidad, así como de dirigir, identificar, coordinar, promover, gestionar y evaluar acciones en materia de cooperación y relaciones a nivel nacional e internacional, en el marco de las políticas y normativas nacionales de educación superior."]},{"n":40,"t":"Funciones de la Oficina de Cooperación y Relaciones Internacionales","c":"CAPÍTULO V","b":["Proponer políticas y lineamientos de relación y cooperación; así como promover la suscripción de convenios con instituciones locales, nacionales e internacionales.","Gestionar los Convenios Interinstitucionales, Programas y Proyectos de Cooperación Internacional que contribuyan a fomentar la investigación y el desarrollo tecnológico, de acuerdo a los objetivos y metas de la Universidad.","Emitir opinión técnica respecto de los convenios, programas, proyectos y actividades de cooperación internacional y nacional, y de otros temas en el ámbito de su competencia.","Proponer la aplicación de estrategias, planes y acciones para asegurar la pertinencia y cumplimiento de los convenios nacionales e internacionales suscritos por la Universidad.","Proponer directivas y demás documentos de gestión interna que correspondan orientados al cumplimiento de los objetivos y metas de la Universidad en materia de cooperación.","Conducir y vigilar el proceso técnico de formulación, seguimiento y evaluación de los convenios, planes, programas y proyectos de cooperación coordinando con las unidades de organización, y organismos involucrados.","Brindar asistencia sobre las modalidades de cooperación y las actividades que involucran la propuesta, celebración y ejecución de convenios de cooperación internacional y nacional; así como promover la difusión de sus alcances y beneficios en la comunidad universitaria.","Mantener y difundir información actualizada sobre cooperación y financiamiento nacional e internacional que requieran los programas y proyectos de investigación y transferencia tecnológica de la Universidad.","Proponer y gestionar los programas de pasantías y capacitaciones a nivel nacional e internacional.","Propiciar el acceso para obtener recursos y donaciones provenientes de fuentes cooperantes nacionales e internacionales de carácter académico, científico

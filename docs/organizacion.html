 y de investigación a favor de la comunidad universitaria, de acuerdo con la normatividad vigente.","Realizar otras funciones en materia de su competencia que le asigne el Rectorado."]},{"n":41,"t":"Unidad de Internacionalización","c":"CAPÍTULO V","b":["La Unidad de Internacionalización es la unidad orgánica de asesoramiento dependiente de la Oficina de Cooperación y Relaciones Internacionales responsable de proponer, ejecutar y coordinar los planes y acciones que contribuyan al posicionamiento e internacionalización de la Universidad."]},{"n":42,"t":"Funciones de la Unidad de Internacionalización","c":"CAPÍTULO V","b":["Ejecutar las políticas, lineamientos y actividades de cooperación internacional orientados al proceso de internacionalización y al posicionamiento sostenido de la Universidad en los rankings internacionales.","Formular el Plan Anual de Internacionalización de la Universidad.","Promover el relacionamiento de la Universidad con universidades e instituciones internacionales.","Gestionar la movilidad y el relacionamiento académico internacional de la Universidad, así como promover y difundir oportunidades de capacitación, becas y concursos, en el marco de los convenios y programas de cooperación internacional suscritos por la Universidad a través de la Oficina de Cooperación y Relaciones Internacionales.","Difundir a nivel internacional la oferta educativa de la Universidad en coordinación con las unidades de organización relacionados.","Brindar asistencia y asesoramiento a las Facultades y órganos en relación a la movilidad académica.","Identificar y efectuar seguimiento de redes académicas y de instituciones cooperantes internacionales para su vinculación con la Universidad.","Organizar, promover y difundir actividades de reconocimiento de alumnos y docentes de intercambio académico; así como recepción de alumnos y docentes de universidades extranjeras.","Realizar otras funciones en materia de su competencia que le asigne la Oficina de Cooperación y Relaciones Internacionales."]},{"n":43,"t":"Oficina de Comunicación e Imagen Institucional","c":"CAPÍTULO V","b":["La Oficina de Comunicación e Imagen Institucional es el órgano de asesoramiento del Rectorado responsable de conducir los procesos de comunicación social, posicionamiento de la imagen institucional y de la interacción con instituciones públicas, privadas, nacionales y extranjeras, a través de los distintos medios de comunicación."]},{"n":44,"t":"Funciones de la Oficina de Comunicación e Imagen Institucional","c":"CAPÍTULO V","b":["Diseñar e implementar las políticas y estrategias de comunicación interna y externa; y de imagen institucional.","Planificar, organizar, dirigir, supervisar y evaluar las actividades de imagen institucional, relaciones públicas, prensa, protocolo e identidad institucional.","Promover y difundir, a través de los diversos medios de comunicación, la imagen institucional interna y externa de la universidad, líder en ciencia, tecnología e innovación al servicio del país.","Organizar y dirigir el desarrollo de eventos oficiales aprobados; así como de las actividades de protocolo y de identidad institucional.","Recabar información de las autoridades universitarias, facultades y de otros para fines informativos.","Difundir, informar y distribuir información relevante a la comunidad universitaria y a la sociedad sobre las actividades y logros académicos, de investigación e innovación tecnológica, gestión institucional, sociales, culturales y deportivos de la UNI a través de los diferentes instrumentos y medios de comunicación y redes sociales.","Estandarizar la publicidad utilizada por la universidad a nivel interno y externo fomentando el uso obligatorio del logo institucional; y elaborar los saludos institucionales.","Proponer y ejecutar actividades para el desarrollo y fortalecimiento de la comunicación fluida con entidades públicas y privadas nacionales e internacionales vinculadas a la Universidad.","Seleccionar, resguardar y sistematizar los archivos publicitarios y periodísticos, materiales gráficos y fotográficos, videos, archivos digitales y otros referidos a las actividades desarrolladas o vinculadas con la Universidad.","Evaluar la opinión pública en relación a la gestión institucional.","Proponer la calendarización anual de eventos oficiales en la Universidad.","Realizar otras funciones en materia de su competencia que le asigne el Rectorado.","05. ADMINISTRACIÓN INTERNA: ÓRGANOS DE APOYO"]},{"n":45,"t":"Administración Interna: Órganos de Apoyo.","c":"CAPÍTULO VI","b":["Constituyen Órganos de Apoyo de la UNI los siguientes:","05.1Secretaría General","05.2Dirección General de Administración.","05.2.1Unidad de Recursos Humanos.","05.2.2Unidad de Abastecimiento.","05.2.3Unidad de Tesorería y Contabilidad.","05.2.4Unidad Ejecutora de Inversiones.","05.2.5Unidad de Servicios Generales.","05.3Oficina de Tecnologías de la Información."]},{"n":46,"t":"Secretaría General","c":"CAPÍTULO VI","b":["La Secretaría General es el órgano de apoyo dependiente del Rectorado responsable de brindar asistencia y apoyo técnico administrativo al Rectorado, Consejo Universitario y Asamblea Universitaria. Es fedatario, y con su firma certifica los documentos oficiales de la Universidad."]},{"n":47,"t":"Funciones de la Secretaría General","c":"CAPÍTULO VI","b":["Organizar, conducir y velar por la calidad de los procesos de recepción, registro y distribución de la correspondencia y documentación dirigida a la Universidad o que egresa de ella y del archivo sistematizado de los documentos oficiales.","Formular las actas, directivas, resoluciones y otros documentos referidos a los acuerdos y disposiciones, de la Asamblea Universitaria, Consejo Universitario y Rectorado.","Participar como Secretario (a) en las sesiones de la Asamblea Universitaria, Consejo Universitario, Comisión Permanente de Fiscalización y otras reuniones a solicitud del Rectorado.","Informar sobre trámites y estado de expedientes, prestando orientación adecuada al solicitante.","Dar curso a las informaciones oficiales y otras de interés general para el conocimiento de la comunidad universitaria y del exterior, a través de La Gaceta u otros medios.","Fedatear, certificar y autenticar la documentación oficial de la Universidad.","Tramitar, extender y registrar los grados, títulos, certificaciones académicas y honoríficas que otorga la Universidad, extender duplicados de los grados y títulos, constancias y autenticación de documentos oficiales, de acuerdo con la normativa aplicable.","Proponer e implementar mejoras en la gestión de la administración documentaria y del registro de las sesiones de los órganos de gobierno de la Universidad; así como de los sistemas que permitan el adecuado acceso a la información y documentación.","Dirigir la transferencia y eliminación de documentos de acuerdo a la normativa vigente.","Proponer la normativa interna y procedimientos que contribuyan a un adecuado sistema de trámite documentario y de archivo de material documental en la universidad, de acuerdo con la normativa aplicable.","Organizar y conducir el Archivo Central de la Universidad, a fin de dirigir las actividades archivísticas a nivel institucional para facilitar la organización, administración y conservación de los documentos en custodia de todos los archivos de la Universidad.","Supervisar el mantenimiento de ambientes e instalaciones para el adecuado cuidado, seguridad, y conservación de la documentación en el Archivo Central.","Velar por el fiel cumplimiento de lo dispuesto por la normativa de transparencia y acceso a la información pública.","Gestionar el proceso de atención de reclamos de la Universidad, de conformidad con la normativa vigente, coordinando con las unidades de organización competentes y efectuando el seguimiento de su atención y respuesta.","Realizar otras funciones en materia de su competencia que le asigne el Rectorado."]},{"n":48,"t":"Dirección General de Administración","c":"CAPÍTULO VI","b":["La Dirección General de Administración es el órgano de apoyo del Rectorado responsable de dirigir, coordinar, regular, controlar y evaluar los procesos y actividades de administración de los recursos económicos, financieros, logísticos y humanos; y de los servicios generales en la Universidad, con criterios de calidad, equidad y pertinencia. Las unidades orgánicas de la Dirección General de Administración son las siguientes:","Unidad de Recursos Humanos","Unidad de Abastecimiento","Unidad de Tesorería y Contabilidad","Unidad Ejecutora de Inversiones","Unidad de Servicios Generales"]},{"n":49,"t":"Funciones de la Dirección General de Administración","c":"CAPÍTULO VI","b":["Dirigir los procesos relacionados a los sistemas administrativos de contabilidad, tesorería, abastecimiento, recursos humanos, servicios generales y control patrimonial, en el ámbito de sus competencias y de conformidad con la normatividad vigente.","Administrar racionalmente los recursos económicos y financieros en concordancia con el Plan Estratégico Institucional y el Plan Operativo Institucional.","Dirigir y supervisar los pagos y controlar las actividades de ingreso y egresos de fondos por toda fuente de financiamiento, así como la custodia y administración.","Brindar información y asistencia técnica a la Alta Dirección en materia administrativa y financiera.","Proponer a la Alta Dirección las normas, lineamientos, directivas internas, entre otros, que coadyuven al mejor funcionamiento de los sistemas administrativos.","Supervisar la ejecución del presupuesto institucional en concordancia con las políticas establecidas por la Alta Dirección.","Participar en coordinación con la Oficina de Planeamiento y Presupuesto, en la programación, formulación y supervisión del presupuesto institucional, según su ámbito de competencia.","Coordinar el adecuado funcionamiento de los Sistemas Administrativos a su cargo y la correcta y oportuna administración de personal, recursos materiales, financieros y servicios generales.","Informar de manera oportuna y periódica a la Alta Dirección y a las entidades competentes sobre la situación económica, financiera y patrimonial de la Universidad.","Velar por la adecuada formulación de los estados financieros de la Universidad.","Supervisar el adecuado control previo y concurrente de las operaciones administrativas y financieras de la universidad, en cumplimiento con lo dispuesto en las normas vigentes.","Emitir opinión técnica respecto a aspectos relacionados a los procesos y actividades cuya naturaleza están comprendidas en el ámbito de su competencia.","Realizar los actos y acciones administrativos que correspondan en el marco de las competencias y funciones asignadas en la normativa vigente.","Promover y supervisar el desarrollo de las acciones de capacitación del personal administrativo de la Universidad.","Realizar otras funciones en materia de su competencia, que sean asignadas por el Rectorado."]},{"n":50,"t":"Unidad de Recursos Humanos","c":"CAPÍTULO VI","b":["La Unidad de Recursos Humanos es la unidad orgánica de apoyo dependiente de la Dirección General de Administración responsable de ejecutar y coordinar los procesos de gestión de los recursos humanos en la UNI, en el marco de la política de Estado respecto del Servicio Civil y las normas correspondientes."]},{"n":51,"t":"Funciones de la Unidad de Recursos Humanos","c":"CAPÍTULO VI","b":["Formular, proponer y ejecutar la Política de Administración de los recursos humanos de la Universidad, así como proponer lineamientos y demás instrumentos normativos internos para su adecuada gestión.","Ejecutar las disposiciones normativas e Instrumentos de gestión establecidos por la Autoridad Nacional de Servicio Civil - SERVIR y demás normativas en materia laboral, remunerativa y pensionaria.","Organizar, promover, coordinar, dirigir y controlar los procesos de convocatoria, selección, contratación, inducción, evaluación de desempeño, desarrollo y desvinculación de los recursos humanos de la universidad","Formular, ejecutar, evaluar y realizar el seguimiento del Plan de Desarrollo de las Personas, el Plan Anual de Capacitación y demás instrumentos orientados al desarrollo de capacidades del personal de la Universidad, en función de las necesidades institucionales identificadas.","Administrar, resguardar y mantener actualizados los legajos, registros, historial laboral y bases de datos del personal de la Universidad, garantizando su confidencialidad, así como gestionar el control de asistencia y permanencia del personal, de conformidad con la normativa vigente.","Realizar el seguimiento y evaluar mediante indicadores, el desempeño de los procesos de administración de recursos humanos, así como mantener actualizadas las estadísticas y registros del personal de la Universidad, incluyendo el Registro Nacional de Sanciones y demás registros vinculados, de conformidad con la normativa vigente.","Formular, proponer y mantener actualizado el Manual Clasificador de Cargos, el Cuadro de Asignación del Personal Provisional, los Perfiles de Puestos y demás instrumentos de gestión relacionados con la administración de recursos humanos, así como realizar el seguimiento de la programación y ejecución presupuestal del gasto en personal, de conformidad, con la normativa vigente.","Gestionar y ejecutar el proceso de elaboración y pago de la planilla única de remuneraciones, pensiones y compensaciones del personal docente y no docente, así como los procedimientos para el reconocimiento y otorgamiento de pensiones, derechos y demás beneficios sociales del personal, verificando su cumplimiento de conformidad con la normativa vigente.","Brindar asesoramiento, emitir opinión técnica y absolver consultas en el ámbito de su competencia.","Identificar, proponer e implementar mejoras en los procesos de gestión de recursos humanos.","Consolidar información, elaborar informes y reportes del personal docente y no docentes de la universidad en actividad, cesantes y pensionistas y presentarlos a la Dirección General de Administración, sobre la base de la información disponible y la proporcionada por las unidades de organización correspondientes.","Gestionar y realizar el seguimiento del cumplimiento de la normativa en materia de seguridad y salud en el trabajo, así como de la ejecución de los programas y servicios de bienestar social dirigidos al personal y sus familiares.","Ejercer las funciones del Oficial de Integridad de la Universidad, implementando y realizando el seguimiento del Modelo de Integridad, gestionando los riesgos de integridad, coordinando las acciones de capacitación, atendiendo y derivando las denuncias por presuntos actos de corrupción, brindando orientación en materia de integridad y ética, y efectuando las demás acciones previstas en la normativa vigente.","Realizar otras funciones que le asigne la Dirección General de Administración y las que le correspondan de acuerdo a los dispositivos legales, dentro del ámbito de su competencia."]},{"n":52,"t":"Unidad de Abastecimiento","c":"CAPÍTULO VI","b":["La Unidad de Abastecimiento es la unidad orgánica de apoyo dependiente de la Dirección General de Administración responsable de ejecutar y coordinar los procesos del Sistema Nacional de Abastecimiento y de la contratación pública, a fin de atender los requerimientos de las unidades de organización"]},{"n":53,"t":"Funciones de la Unidad de Abastecimiento","c":"CAPÍTULO VI","b":["Proponer políticas y lineamientos para una adecuada administración del abastecimiento en la Universidad.","Planificar, organizar, ejecutar, controlar y evaluar los procesos del sistema de abastecimiento en la Universidad en el ámbito de su competencia.","Gestionar y consolidar el Cuadro Multianual de Necesidades de Bienes y Servicios según los requerimientos programados por las unidades de organización de la Universidad, para la formulación   del Plan Anual de Contrataciones, y las modificaciones que pudieran derivarse.","Determinar el valor estimado y el valor referencial de los bienes y servicios, según corresponda, efectuando los estudios de posibilidades que ofrece el mercado. Realizando la interacción con el mercado y determinar la cuantía de la contratación de bienes, servicios y obras, conforme a la normativa vigente.","Establecer y controlar los procedimientos de selección que requieran las unidades de organización de la Universidad, así como proponer los expedientes de contratación y documentos respectivos y brindar asistencia técnica a los evaluadores de los procedimientos de selección, según corresponda.","Fiscalizar la autenticidad de las declaraciones, documentos, información y traducciones presentadas por el ganador de la buena pro, conforme a la normativa de contratación pública.","Gestionar los contratos, órdenes de compras y órdenes de servicio que involucran el trámite de perfeccionamiento, aplicación de penalidades y procedimiento de pago, entre otras actividades de índole administrativo, en cumplimiento de lo regulado en la Ley de Contrataciones Públicas y su Reglamento.","Administrar el almacenamiento, suministro y distribución de los bienes necesarios para el funcionamiento de la Universidad, manteniendo el registro, control y conservación de las existencias del almacén, así como realizar periódicamente el inventario físico de los mismos.","Proponer las políticas y procedimientos para el arrendamiento de ambientes y/o locales de la Universidad, así como elaborar las bases de arrendamiento y contratos de concesión, etc.","Gestionar los despachos de importación/exportación a nivel institucional.","Gestionar las actividades relativas a la autorización del uso de bienes fiscalizados por la SUNAT a nivel institucional.","Realizar otras funciones, en materia de su competencia, que le asigne la Dirección General de Administración."]},{"n":54,"t":"Unidad de Tesorería y Contabilidad","c":"CAPÍTULO VI","b":["La Unidad de Tesorería y Contabilidad es la unidad orgánica de apoyo dependiente de la Dirección General de Administración responsable de planificar, ejecutar y evaluar los procesos técnicos y los recursos económicos y financieros de Tesorería; así como de ejecutar las normas y procedimientos del Sistema Nacional de Tesorería y del Sistema Nacional de Contabilidad en la Universidad."]},{"n":55,"t":"Funciones de la Unidad de Tesorería y Contabilidad","c":"CAPÍTULO VI","b":["Planificar, ejecutar, controlar y evaluar los procesos del sistema de tesorería y del sistema de contabilidad.","Administrar el manejo de los fondos y controlar la ejecución del gasto para el cumplimiento de la Ley de Presupuesto Público de acuerdo con la normatividad y demás disposiciones complementarias.","Atender y sustentar ante la Dirección General de Administración sobre los requerimientos de información económico-financiera, contable y tributaria formulados por la Alta Dirección, la OPP, el OCI, las sociedades de auditoría y las unidades de organización competentes, en el ámbito de sus funciones.","Efectuar el control previo, registro y análisis de la ejecución de las operaciones financieras, presupuestales y contables en cumplimiento con lo establecido en las normas de la Dirección General de Contabilidad Pública y demás normas que le sean aplicables.","Identificar mejoras y proponer directivas, normas internas y procedimientos para una administración eficiente de los ingresos y gastos.","Proponer, formular y mantener actualizados los documentos normativos de gestión financiera y contable que permitan la adecuada supervisión y control de los recursos; así como procedimientos para el correcto registro y procesamiento de las operaciones contables.","Emitir opinión técnica en materia económica, financiera, contable y tributaria, dentro del ámbito de su competencia.","Registrar, analizar, conciliar y presentar la información contable, financiera y complementaria de la Universidad, de conformidad con la normativa vigente.","Gestionar y procesar la información financiera y contable institucional, incluyendo el registro y trazabilidad de las operaciones, la conciliación y consolidación de información, y la elaboración de reportes de saldos financieros y transferencias internas para la toma de decisiones.","Mantener un adecuado nivel de liquidez administrando y controlando adecuadamente los recursos económicos y financieros para el cumplimiento de compromisos con terceros.","Gestionar y ejecutar las operaciones de ingresos, recaudación, pagos, giros, transferencias financieras y conciliaciones bancarias, en el marco del Sistema Nacional de Tesorería y en coordinación con las unidades de organización competentes.","Registrar y controlar las operaciones financieras y contables en el SIAF-SP y demás sistemas de información que resulten aplicables, de conformidad con la normativa vigente.","Gestionar y custodiar los depósitos de dinero y de títulos valores de la Universidad en las entidades del Sistema Financiero de conformidad con la normativa.","Coordinar con las unidades de organización competentes, según su ámbito de competencia, para asegurar la consistencia de la información económico-financiera de la Universidad.","Realizar otras funciones, en materia de su competencia, que le asigne la Dirección General de Administración."]},{"n":56,"t":"Unidad Ejecutora de Inversiones","c":"CAPÍTULO VI","b":["La Unidad Ejecutora de Inversiones es la unidad orgánica de apoyo de la Dirección General de Administración, responsable de la programación, ejecución y control de proyectos, obras y edificaciones en la Universidad."]},{"n":57,"t":"Funciones de la Unidad Ejecutora de Inversiones","c":"CAPÍTULO VI","b":["Formular y ejecutar las políticas y estrategias de desarrollo urbano y arquitectónico sustentable de la planta física del campus universitario","Registrar y mantener actualizada la información del avance físico y financiero de las inversiones a su cargo en los aplicativos informáticos del SNPMGI, así como efectuar el registro correspondiente al monitoreo y seguimiento de su ejecución física y financiera.","Ejecutar física y financieramente las inversiones, considerando las herramientas de dirección de proyectos y la metodología BIM, cuando corresponda, así como realizar el monitoreo y seguimiento de su ejecución física y financiera, conforme al marco normativo establecido.","Cautelar que se mantenga la concepción técnica, económica y dimensionamiento de los proyectos de inversión, obras y edificaciones, durante la ejecución física de estos.","Dirigir, coordinar y controlar los procesos de entrega, recepción y liquidación técnica-financiera de las inversiones, conforme a la normativa vigente.","Remitir información sobre las inversiones que solicite la Dirección General de Programación Multianual de Inversiones y los demás órganos del Sistema Nacional de Programación Multianual y Gestión de Inversiones.","Elaborar el expediente técnico o documento equivalente de los proyectos de inversión, sujetándose a la concepción técnica, económica y el dimensionamiento contenido en los documentos técnicos; así como elaborar el expediente técnico o documento equivalente para las IOARR, sujetándose a la información registrada en los aplicativos informáticos del SNPMGI, teniendo en cuenta las orientaciones metodológicas que establece la DGPMI.","Emitir opinión técnica en su especialidad cuando sea solicitada por las unidades de organización.","Realizar, bajo responsabilidad, el cierre de las inversiones conforme a las disposiciones que emita la DGPMI, incluyendo el cierre de oficio cuando corresponda, según el procedimiento aprobado por el OR o el titular de la entidad a cargo de la ejecución de la inversión, o en quien delegue.","Ejecutar los componentes y acciones de los proyectos de inversión, pudiendo realizar su ejecución por etapas cuando las características del proyecto lo permitan, resulte más eficiente y asegure la generación oportuna de los beneficios previstos en los documentos técnicos que sustentan su viabilidad.","Mantener actualizado el registro del equipo técnico de la Unidad Ejecutora de Inversiones en los aplicativos informáticos del SNPMGI.","Elaborar el programa de mantenimiento de los activos generados con la inversión y registrar la información proporcionada por las unidades orgánicas sobre el mantenimiento de las Unidades Productoras, conforme a la normativa vigente.","Definir el sistema de entrega más conveniente en el marco del Sistema Nacional de Abastecimiento y, en caso de ejecución por administración directa, sustentar dicha modalidad considerando su eficiencia en términos de costo y/o tiempo.","Realizar otras funciones que le sean encargadas por la Dirección General de Administración y la Alta Dirección, así como aquellas funciones que le confieran los dispositivos legales dentro del ámbito de su competencia."]},{"n":58,"t":"Unidad de Servicios Generales","c":"CAPÍTULO VI","b":["La Unidad de Servicios Generales es la unidad orgánica de apoyo de la Dirección General de Administración, responsable de atender los servicios de mantenimiento, limpieza y residuos sólidos, seguridad y vigilancia, vivero y áreas verdes, transporte y demás servicios generales que requiera la Universidad."]},{"n":59,"t":"Funciones de la Unidad de Servicios Generales","c":"CAPÍTULO VI","b":["Proponer y formular lineamientos, normas internas, programas, planes y procedimientos sobre aspectos inherentes relacionados a su competencia funcional.","Planificar, ejecutar y evaluar los procesos de mantenimiento, seguridad y vigilancia, limpieza y residuos sólidos, vivero y áreas verdes, transporte y demás servicios generales de la Universidad.","Formular e implementar el Plan Anual de Servicios Generales de la universidad, de acuerdo al requerimiento de las unidades de organización de la Universidad.","Diseñar y ejecutar acciones para la prevención, control y mitigación de impacto ambiental que produce la Universidad en cumplimiento con la normativa ambiental.","Proponer y promover medidas y procedimientos adecuados para el manejo de residuos sólidos, sanitaria y ambientalmente, así como la prevención de impactos negativos y asegurar la protección de la salud de la comunidad universitaria.","Adoptar, supervisar y evaluar las medidas necesarias y suficientes para proteger la integridad física y vida de la comunidad universitaria y de las personas externas en el campus universitario.","Realizar el seguimiento e investigaciones por robos y sustracciones ocurridos en el campus universitario a efectos de adoptar medidas preventivas, así como determinar las causas y responsabilidades en coordinación con las unidades de organización, según correspondan.","Autorizar, controlar el ingreso y salida, así como velar por la seguridad y gestionar la conservación de las instalaciones y bienes patrimoniales, en coordinación con la Unidad de Abastecimiento.","Realizar otras funciones, en materia de su competencia, que le asigne la Dirección General de Administración."]},{"n":60,"t":"Oficina de Tecnologías de la Información","c":"CAPÍTULO VI","b":["La Oficina de Tecnologías de la Información es el órgano de apoyo del Rectorado responsable de ejecutar los lineamientos de política en materia de tecnología de información y comunicaciones, transformación e innovación digital, y vigilancia tecnológica, y de los procesos de diseño, desarrollo, adquisición, implementación, integración, mantenimiento, documentación y evaluación de los sistemas de información y de la infraestructura tecnológica de la UNI. Apoya a todas las unidades de organización de la universidad para un uso efectivo de los recursos tecnológicos, tecnologías digitales, redes y servicios digitales; y adicionalmente brinda servicios en el ámbito de su competencia."]},{"n":61,"t":"Funciones de la Oficina de Tecnologías de la Información","c":"CAPÍTULO VI","b":["Conducir la ejecución de la política, el Plan de Gobierno y Transformación Digital, proponer las directivas, normas y estándares institucionales en materia de tecnologías de la información, comunicaciones, transformación digital y vigilancia tecnológica, en el marco de los lineamientos aprobados por la Alta Dirección.","Administrar la adecuada operación y mantenimiento de los sistemas de información, la infraestructura tecnológica, las plataformas digitales, la red de comunicaciones, los servicios de voz/datos y demás servicios a fin de proveer una operatividad continua, y un uso adecuado y oportuno de los servicios informáticos y de comunicación en la Universidad. Asimismo, adquirir y administrar las licencias de software y de sistemas informáticos.","Efectuar el seguimiento y registro sistemático de tendencias de los desarrollos tecnológicos y de la información técnica y especializada; e identificar los factores y las condiciones que los generan, y sus impactos.","Promover y gestionar la implementación de estándares y buenas prácticas en gestión y gobierno de tecnologías digitales en la Universidad que contribuyan a la automatización y digitalización de los procesos académicos y administrativos; así como la ejecución de proyectos de soluciones tecnológicas, y la implementación de sistemas y soluciones informáticas de información y comunicación que permitan incrementar la productividad y eficiencia de los procesos, y la oportuna toma de decisiones.","Brindar oportuno apoyo y soporte tecnológico en hardware y software (HelpDesk) que requieran las unidades de organización de la Universidad; y brindar información sobre tecnologías de información y comunicación. Asimismo, evaluar que el uso actual y futuro de las tecnologías digitales sea acorde con los cambios tecnológicos, regulatorios, necesidades y objetivos institucionales en el marco de la implementación del Gobierno Digital en la Universidad.","Impulsar y formular estrategias y planes; así como proponer y gestionar proyectos de implementación de soluciones de tecnologías de la información y comunicación, transformación e innovación digital orientados a la satisfacción de las necesidades y expectativas de los grupos de interés de la Universidad.","Planificar, y ejecutar programas de fortalecimiento de competencias digitales, alfabetización digital y estrategias de gestión del cambio cultural para la transformación digital, incluyendo capacitación, dirigidos al personal docente, administrativo y de gestión de las unidades de organización de la UNI, promoviendo una cultura impulsada por la innovación, la seguridad digital y el uso eficiente de las tecnologías de la información.","Promover la colaboración e intercambio interinstitucional de experiencias en la implementación de proyectos de transformación digital.","Identificar y evaluar necesidades y oportunidades de aplicación de las tecnologías de información y comunicación a nivel institucional sobre la base de los avances tecnológicos en el mercado.","Dar cumplimiento a las disposiciones, directivas y normas técnicas emitidas por la Secretaría de Gobierno y Transformación Digital (SGTD) de la Presidencia del Consejo de Ministros, en su calidad de ente rector del Sistema Nacional de Transformación Digital, y demás normativa nacional aplicable en materia de tecnologías de la información, confianza y transformación digital; así como mantener actualizado el Portal de Transparencia Estándar de la Universidad Nacional de Ingeniería.","Gestionar la seguridad digital y de la información de la UNI mediante la implementación del Sistema de Gestión de Seguridad de la Información (SGSI) en los procesos institucionales, la conducción técnica del Equipo de Respuesta ante Incidentes de Seguridad Digital (CSIRT) y la ejecución periódica de análisis de vulnerabilidades y pruebas de intrusión, y la formulación y actualización de los planes de continuidad operativa y de recuperación ante desastres en los sistemas, infraestructura y redes que soportan los servicios digitales universitarios.","Implementar y supervisar la publicación de los datos gubernamentales de la Universidad en la Plataforma Nacional de Datos Abiertos; garantizando la aplicación técnica de mecanismos de disociación y anonimización para proteger la privacidad de los datos personales, así como la gestión y transferencia segura de información a través de la Plataforma de Interoperabilidad del Estado (PIDE) con entidades internas y externas.","Realizar otras funciones, en materia de su competencia, que le asigne la Alta Dirección.","06. ÓRGANOS DE LÍNEA"]},{"n":62,"t":"Órganos de Línea","c":"CAPÍTULO VII","b":["Constituyen órganos de línea de la Universidad Nacional de Ingeniería los siguientes:","06.1 Consejo de Facultad.","06.2 Decanato.","06.2.1Departamento Académico.","06.2.2Escuela Profesional.","06.2.3Unidad de Investigación.","06.2.4Unidad de Posgrado.","06.2.5Unidad de Servicios de Facultad.","06.2.6Unidad de Servicios de Apoyo Académico.","Órganos Dependientes del Rectorado","06.3 Escuela de Posgrado","06.4 Dirección de Bienestar Universitario","06.4.1 Unidad de Centro Médico","06.4.2 Unidad de Centro de Disciplinas Deportivas","06.5 Dirección de Responsabilidad Social y Desarrollo Sostenible","06.5.1 Unidad de Desarrollo Sostenible","06.5.2 Unidad de Servicios de Extensión","06.5.3 Unidad de Centro Cultural UNI","06.5.4 Unidad de Fondo Editorial","Órganos Dependientes del Vicerrectorado Académico","06.6 Dirección de Biblioteca Central","06.7 Dirección de Registro Central y Estadística","06.8 Dirección de Admisión","06.8.1 Unidad de Centro Pre Universitario","Órganos Dependientes del Vicerrectorado de Investigación","06.9 Dirección de Innovación y Transferencia Tecnológica","06.9.1 Unidad de Incubadora de Empresas","06.9.2 Unidad de Innovación y Transferencia Tecnológica","06.10 Dirección de Gestión de la Investigación","06.10.1 Instituto de Investigación","06.10.2 Unidad de Laboratorio Nacional de Hidráulica","06.10.3 Centro Peruano Japonés de Investigaciones Sísmicas y Mitigación de Desastres","06.10.4 Unidad de Publicación e Indexación de Revistas Científicas"]},{"n":63,"t":"Consejo de Facultad","c":"CAPÍTULO VII","b":["El Consejo de Facultad es el órgano de línea responsable del gobierno de la Facultad. La conducción y su dirección le corresponden al Decanato, en el contexto de los lineamientos y estrategias emanados del Consejo Universitario y de acuerdo con las atribuciones señaladas en la Ley."]},{"n":64,"t":"Funciones del Consejo de Facultad","c":"CAPÍTULO VII","b":["Proponer al Consejo Universitario la contratación, nombramiento, ratificación, promoción y remoción de los docentes de sus respectivos Departamentos Académicos.","Aprobar los currículos y planes de estudio, elaborados por las Escuelas Profesionales que integren la Facultad; así como los proyectos de investigación.","Proponer anualmente al Consejo Universitario el número de vacantes para los estudios de pregrado.","Dictar el Reglamento Académico de la Facultad que comprende las responsabilidades de docentes y estudiantes, así como los regímenes de estudio, evaluación, promoción y sanciones, dentro de las normas establecidas por la Universidad.","Elevar al Consejo Universitario, para su aprobación, propuestas sobre sanciones a los docentes y estudiantes que cometan faltas, y a la garantía del debido proceso.","Aprobar el Plan anual de Funcionamiento y Desarrollo de la Facultad y su Informe de Gestión, presentados por el Decanato.","Dar conformidad al presupuesto anual de la Facultad a propuesta del Decanato; y proponerlo oportunamente al Consejo Universitario para su aprobación.","Conocer y resolver todos los demás asuntos que se presenten dentro del área de su competencia, en concordancia con lo dispuesto en la Ley, el Estatuto y reglamentos.","Coordinar el establecimiento de Programas y actividades de mutua colaboración con las demás Facultades.","Realizar las demás funciones que le otorgue la Ley y el Estatuto."]},{"n":65,"t":"Decanato","c":"CAPÍTULO VII","b":["El Decanato es el órgano de línea dependiente del Rectorado que representa a la máxima autoridad de gobierno académico, administrativo y económico de la Facultad ante el Consejo Universitario y la Asamblea Universitaria, conforme lo dispuesto en la Ley y en el Estatuto."]},{"n":66,"t":"Funciones del Decanato","c":"CAPÍTULO VII","b":["Presidir el Consejo de Facultad.","Dirigir académica, administrativa y económicamente la Facultad.","Dirigir académicamente la Facultad, a través de los Directores de los Departamentos Académicos, de las Escuelas Profesionales, Unidades de Investigación y Unidades de Posgrado.","Conducir la asignación eficiente y gestión transparente de los recursos de la Facultad.","Representar a la Facultad ante la Asamblea Universitaria y ante el Consejo Universitario, en los términos que establece la Ley y el Estatuto.","Designar a los Directores de las Escuelas Profesionales, Institutos de Investigación, Unidades de Investigación y las Unidades de Posgrado.","Proponer al Consejo de Facultad, para su aprobación, sanciones a los docentes y estudiantes que incurran en faltas conforme lo señala la Ley y el Estatuto de la Universidad.","Presentar al Consejo de Facultad, para su aprobación, el Plan Anual de Funcionamiento y Desarrollo de la Facultad y su Informe de Gestión.","Cumplir y hacer cumplir, en el ámbito de su competencia, los acuerdos de la Asamblea Universitaria, del Consejo Universitario y del Consejo de Facultad.","Impulsar la investigación en las distintas especialidades de la Facultad acorde con las necesidades actuales y retos futuros de los sectores productivos y de servicios del país, en el marco de los objetivos de desarrollo sostenible.","Realizar las demás atribuciones que la Ley y el Estatuto le asignen."]},{"n":67,"t":"La Universidad Nacional de Ingeniería cuenta con las siguientes Decanaturas","c":"CAPÍTULO VII","b":["Decanatura de la Facultad de Arquitectura, Urbanismo y Artes (FAUA)","Decanatura de la Facultad de Ciencias (FC)","Decanatura de la Facultad de Ingeniería Ambiental (FIA)","Decanatura de la Facultad de Ingeniería Civil (FIC)","Decanatura de la Facultad de Ingeniería Económica, Estadística y Ciencias Sociales (FIEECS)","Decanatura de la Facultad de Ingeniería Eléctrica y Electrónica (FIEE)","Decanatura de la Facultad de Ingeniería Geológica, Minera y Metalúrgica (FIGMM)","Decanatura de la Facultad de Ingeniería Industrial y de Sistemas (FIIS)","Decanatura de la Facultad de Ingeniería Mecánica (FIM)","Decanatura de la Facultad de Ingeniería de Petróleo, Gas Natural y Petroquímica (FIP)","Decanatura de la Facultad de Ingeniería Química y Textil (FIQT)"]},{"n":68,"t":"Departamento Académico","c":"CAPÍTULO VII","b":["El Departamento Académico es la unidad orgánica de línea dependiente del Decanato responsable de dirigir a los docentes de disciplinas afines con la finalidad de estudiar, investigar y actualizar contenidos, mejorar estrategias pedagógicas y preparar los sílabos por cursos o materiales de acuerdo a los requerimientos de las Escuelas Profesionales.","Cada Departamento Académico se integra a una Facultad sin perjuicio de su función de brindar servicios a otras Facultades."]},{"n":69,"t":"La Universidad Nacional de Ingeniería cuenta con los siguientes Departamentos Académicos","c":"CAPÍTULO VII","b":["Facultad de Arquitectura, Urbanismo y Artes","Departamento Académico de Diseño","Departamento Académico de Urbanismo","Departamento Académico de Historia","Departamento Académico de Expresión Gráfica","Departamento Académico de Tecnología","Departamento Académico de Artes","Departamento Académico de Ciencias Básicas","Facultad de Ciencias","Departamento Académico de Física","Departamento Académico de Química","Departamento Académico de Matemática","Departamento Académico de Ingeniería Física","Departamento Académico de Ciencias de la Computación","Facultad de Ingeniería Ambiental","Departamento Académico de Saneamiento","Departamento Académico de Higiene y Seguridad Ocupacional","Departamento Académico de Ingeniería y Gestión Ambiental","Departamento Académico de Ciencias y Estudios Específicos Básicos","Facultad de Ingeniería Civil","Departamento Académico de Construcción","Departamento Académico de Estructuras","Departamento Académico de Ingeniería Geotécnica","Departamento Académico de Ciencias Básicas","Departamento Académico de Hidráulica e Hidrología","Departamento Académico de Vialidad y Geomática","Facultad de Ingeniería Económica, Estadística y Ciencias Sociales","Departamento Académico de Humanidades y Ciencias Sociales","Departamento Académico de Métodos Cuantitativos","Departamento Académico de Estadística","Departamento Académico de Economía","Facultad de Ingeniería Eléctrica y Electrónica","Departamento Académico de Electricidad","Departamento Académico de Electrónica","Departamento Académico de Telecomunicaciones","Departamento Académico de Ciberseguridad","Facultad de Ingeniería Geológica, Minera y Metalúrgica","Departamento Académico de Gestión Minera","Departamento Académico de Minería","Departamento Académico de Geología Básica","Departamento Académico de Geología Aplicada","Departamento Académico de Metalúrgica Extractiva","Departamento Académico de Metalúrgica Física","Facultad de Ingeniería Industrial y de Sistemas","Departamento Académico de Ciencias Básicas","Departamento Académico de Gestión de la Producción","Departamento Académico de Humanidades y Ciencias Sociales","Departamento Académico de Sistemas y Telemática","Departamento Académico de Tecnología de la Producción","Facultad de Ingeniería Mecánica","Departamento Académico de Ciencias Básicas, Humanidades y Cursos Complementarios","Departamento Académico de Ciencias de Ingeniería","Departamento Académico de Ingeniería Aplicada","Facultad de Ingeniería de Petróleo, Gas Natural y Petroquímica","Departamento Académico de Ingeniería del Petróleo y Gas Natural","Departamento Académico de Ingeniería Petroquímica","Departamento Académico de Ciencias Básicas","Facultad de Ingeniería Química y Textil","Departamento Académico de Ciencias Básicas","Departamento Académico de Cursos Complementarios","Departamento Académico de Ingeniería Química","Departamento Académico de Ingeniería Textil"]},{"n":70,"t":"Funciones del Departamento Académico","c":"CAPÍTULO VII","b":["Elaborar la carga académica de los docentes del Departamento, según los requerimientos curriculares de las Escuelas Profesionales.","Supervisar la elaboración y actualización de los sílabos, de acuerdo al requerimiento de las Escuelas Profesionales.","Determinar los criterios técnicos para la asignación de la carga horaria y su distribución entre los docentes del Departamento.","Administrar la carga académica, tanto lectiva como no lectiva, de los docentes del Departamento Académico, de acuerdo a su especialidad, en coordinación con la Escuela Profesional correspondiente.","Supervisar y evaluar semestralmente las labores académicas y de investigación de los docentes y, en base a los resultados, implementar las acciones correctivas y de mejoras de calidad educativa.","Supervisar la puntualidad, asistencia y producción de los docentes.","Informar anualmente sobre los requerimientos de Personal Docente; y proponer la creación de plazas de docentes para contratación y nombramiento y de plazas para la contratación de jefes de práctica y ayudantes de cursos o laboratorio, en base a una evaluación de racionalización académica.","Administrar las actividades académicas de los laboratorios, talleres y otros similares.","Proponer y ejecutar el Plan Semestral de Desarrollo, Capacitación y Perfeccionamiento de los docentes.","Realizar las demás funciones inherentes al nivel y la naturaleza del Departamento Académico que le asigne el Decanato."]},{"n":71,"t":"Escuela Profesional","c":"CAPÍTULO VII","b":["La Escuela Profesional es la unidad orgánica de línea dependiente del Decanato responsable del diseño y actualización curricular de la carrera profesional, de acuerdo al avance de la ciencia y tecnología, así como de dirigir su aplicación, para la formación y capacitación pertinente  Vicerrectorado de Investigación.","Articular la labor de investigación con las necesidades tecnológicas de las empresas de la UNI.","Realizar otras funciones que señalen el Consejo de Facultad y el Decanato."]},{"n":76,"t":"Unidad de Posgrado","c":"CAPÍTULO VII","b":["La Unidad de Posgrado es la unidad orgánica de línea dependiente del Decanato responsable de integrar las actividades de Posgrado de la Facultad; y es encargada de planificar, organizar y ejecutar la implementación de las actividades de Posgrado en coordinación con la Escuela de Posgrado."]},{"n":77,"t":"Funciones de la Unidad de Posgrado","c":"CAPÍTULO VII","b":["Gestionar la oferta y desarrollo de sus programas para los estudios de Segunda Especialidad, Diplomados, Maestrías y Doctorados de la Facultad de acuerdo con los lineamientos de la Escuela de Posgrado.","Implementar y ejecutar las políticas y normas que establezca la Escuela de Posgrado.","Formular y proponer los Programas de estudio de Posgrado.","Organizar y conducir el proceso de admisión de Posgrado.","Diseñar, proponer, evaluar y mantener actualizados los sílabos de los cursos de Segunda Especialidad, Diplomados, Maestrías y Doctorados.","Coordinar, ejecutar y supervisar el adecuado desarrollo de los estudios de Segunda Especialidad, Diplomados, Maestrías y Doctorados de la Facultad.","Establecer las coordinaciones con la Escuela de Posgrado para la programación y ejecución de las actividades académicas en la Unidad de Posgrado.","Proponer los planes de mejora de la Unidad de Posgrado a la Escuela de Posgrado y ejecutar su implementación.","Solicitar y administrar los recursos y servicios que se requieran para la adecuada ejecución de las actividades en la Unidad de Posgrado.","Realizar otras funciones que señale el Decanato."]},{"n":78,"t":"Unidad de Servicios de Facultad","c":"CAPÍTULO VII","b":["La Unidad de Servicios de Facultad es la unidad orgánica de línea dependiente del Decanato, encargada de programar, distribuir, facilitar y  de la gestión documentaria y administrativa de los asuntos de competencia de la Facultad, asegurando su atención oportuna y trazabilidad.","Coordinar con las unidades competentes las acciones de seguridad, mantenimiento, prevención de riesgos y continuidad de los servicios necesarios para el normal funcionamiento de la Facultad.","Realizar la programación y distribución de aulas y ambientes, así como verificar su habilitación y disponibilidad, de acuerdo con los requerimientos del dictado de cursos y demás actividades de la Facultad.","Realizar otras funciones en el marco de su competencia que le asigne el Decanato."]},{"n":80,"t":"Unidad de Servicios de Apoyo Académico","c":"CAPÍTULO VII","b":["La Unidad de Servicios de Apoyo Académico es la unidad orgánica de línea dependiente del Decanato responsable de desarrollar actividades que contribuyan al buen rendimiento académico de los estudiantes."]},{"n":81,"t":"Funciones de la Unidad de Servicios de Apoyo Académico","c":"CAPÍTULO VII","b":["Proponer, ejecutar y controlar el cumplimiento del Plan de la Unidad con la finalidad de garantizar el alcance de los objetivos.","Proponer y cumplir con las directivas, reglamentos y/o normas de funcionamiento de la Unidad.","Realizar un diagnóstico del rendimiento académico de los estudiantes y presentar alternativas de solución a los problemas identificados.","Cumplir con las políticas y lineamientos vinculados a la gestión de rendimiento académico de los estudiantes.","Gestionar, supervisar la ejecución del Plan de Tutoría y el acompañamiento académico de los estudiantes de la Facultad, en coordinación con los docentes.","Facilitar, en coordinación con la Dirección de Incubadoras de Empresas, la asesoría docente y facilidades de acceso y uso de los equipos e instalaciones de la Universidad a las empresas creadas por los estudiantes y docentes en las fases del emprendimiento.","Mantener actualizada la información estadística de las actividades que contribuyen al buen rendimien investigación, desarrollo tecnológico e innovación con los estudios de posgrado.","Proponer y supervisar el cumplimiento de los reglamentos, normas internas y directivas inherentes a la creación, modificación, ejecución, cierre temporal o permanente de los estudios de posgrado; así como de la obtención de los respectivos grados académicos.","Velar por la calidad y la actualización de los programas de estudios de Posgrado en la Universidad, de acuerdo a los lineamientos y disposiciones en materia de calidad académica y de acreditación.","Supervisar el proceso de admisión de Posgrado, en coordinación con las Unidades de Posgrado de las Facultades.","Gestionar el relacionamiento de los estudios de Posgrado de la Universidad con universidades e instituciones públicas y privadas, nacionales e internacionales; así como promover la realización de estudios de posgrado con doble grado.","Coordinar con la Oficina de Comunicación e Imagen Institucional la difusión de publicaciones informativas de los programas de estudios de Posgrado de la Universidad, y la divulgación de las tesis y trabajos de investigación recomendados para su publicación.","Promover la creación de nuevos programas de estudios de posgrado por iniciativa propia o recogiendo iniciativas de las Facultades, y la realización de trabajos de investigación a nivel posgrado.","Otorgar certificados y constancias de estudios, y proponer la revalidación o reconocimiento de grados académicos de posgrado.","Informar a la Alta Dirección respecto al desarrollo de la ejecución de los programas de estudios de posgrado y de los logros alcanzados.","Realizar otras funciones que le confiera el Estatuto, y las que le asigne la Alta Dirección."]},{"n":84,"t":"Dirección de Bienestar Universitario","c":"CAPÍTULO VII","b":["La Dirección de Bienestar Universitario es el órgano de línea del Rectorado, responsable de dirigir los programas de bienestar universitario y servicios primarios y complementarios en materia de alimentación, salud, promoción y práctica de disciplinas deportivas, transporte, residencia estudiantil y asistencia social para los miembros de la comunidad universitaria, promoviendo y apoyando mejores condiciones de desarrollo intelectual y social de sus integrantes con el propósito de coadyuvar a una adecuada formación científica, profesional y laboral. Las unidades orgánicas de la Dirección de Bienestar Universitario son las siguientes:","Las unidades orgánicas de la Dirección de Bienestar Universitario son las siguientes:","Unidad de Centro Médico.","Unidad de Centro de Disciplinas Deportivas."]},{"n":85,"t":"Funciones de la Dirección de Bienestar Universitario","c":"CAPÍTULO VII","b":["Proponer a la Alta Dirección la formulación y ejecución de la política de bienestar de los miembros de la comunidad universitaria.","Establecer normas, reglamentos u otros documentos vinculados a la prestación de los servicios y programas de bienestar universitario.","Identificar permanentemente las necesidades, expectativas e intereses de la comunidad universitaria en el ámbito de los procesos y actividades de los servicios primarios y complementarios en materia de alimentación, salud, promoción y práctica de disciplinas deportivas, transporte, residencia estudiantil y asistencia social.","Organizar programas y ayudantías de becas (alimentación, vivienda, apoyo económico), y préstamos para los estudiantes.","Promover y apoyar acciones de educación social, comunicación y desarrollo personal.","Administrar y organizar el trabajo de asistencia social de acuerdo al estudio actualizado de las condiciones socioeconómicas de la comunidad universitaria.","Administrar los servicios de comedor universitario, control de concesionarios de alimentación y de la residencia de estudiantes.","Administrar y organizar el servicio de transporte a los miembros de la comunidad universitaria, con el soporte de la Unidad de Servicios Generales.","Gestionar y administrar el servicio de Bolsa de Trabajo en favor de la ocionales.","Fortalecer y mejorar las capacidades institucionales en materia de prevención y cuidado de la salud.","Gestionar toda iniciativa de la Alta Dirección en materia de prevención y cuidado de la salud para la comunidad universitaria.","Conducir las acciones de difusión y educación en salud en la Universidad.","Realizar otras funciones en materia de su competencia que le asigne la Dirección de Bienestar Universitario."]},{"n":88,"t":"Unidad de Centro de Disciplinas Deportivas","c":"CAPÍTULO VII","b":["La Unidad de Centro de Disciplinas Deportivas es la unidad orgánica dependiente de la Dirección de Bienestar Universitario responsable de proponer, ejecutar los programas y servicios institucionales relacionados con la actividad física, el deporte, la recreación, los programas deportivos de alta competencia y la representación deportiva institucional; así como de proponer beneficios para los deportistas calificados reconocidos por el Instituto Peruano del Deporte y validar técnicamente las actividades deportivas extracurriculares  ante las instancias competentes de la Universidad."]},{"n":89,"t":"Funciones de la Unidad de Centro de Disciplinas Deportivas","c":"CAPÍTULO VII","b":["Formular y ejecutar la Política Institucional del deporte y recreación en la Universidad Nacional de Ingeniería.","Promover el desarrollo de la práctica de disciplinas deportivas en la comunidad universitaria de la UNI.","Formular las guías, manuales, directivas, procedimientos, instructivos u otros documentos necesarios vinculados a la práctica segura de disciplinas deportivas en la Universidad.","Administrar, promover y apoyar las actividades de recreación, educación física y deportes en lo recreativo, formativo y competitivo.","Gestionar los Programas Deportivos de Alta Competencia (PRODAC) de la Universidad, así como validar los requisitos de los Deportistas Calificados y Deportistas Calificados de Alto Nivel reconocidos por el Instituto Peruano del Deporte para proponer su ingreso l UNI","Unidad de Fondo Editorial"]},{"n":91,"t":"Funciones de la Dirección de Responsabilidad Social y Desarrollo Sostenible","c":"CAPÍTULO VII","b":["Proponer, implementar, dirigir, supervisar y evaluar políticas, lineamientos, planes, programas, acciones y normas internas en materia de responsabilidad social universitaria.","Articular y coordinar las acciones de responsabilidad social universitaria con las Facultades y demás unidades de organización de la Universidad.","Fomentar la cultura de responsabilidad social universitaria, ética, transparencia, diálogo, rendición de cuentas, gestión ambiental y desarrollo humano sostenible en la comunidad universitaria.","Coordinar técnicamente con el Consejo de Responsabilidad social Universitaria la formulación, seguimiento y evaluación del Plan Anual de Responsabilidad Social Universitaria de la Universidad Nacional de Ingeniería.","Diseñar, ejecutar y evaluar estrategias de vinculación con actores sociales, culturales, comunitarios, públicos, privados, académicos y grupos de intereses, identificando oportunidades de cooperación e intervención social en materia de responsabilidad social, extensión cultural y proyección social, gestión ambiental y desarrollo sostenible.","Supervisar y evaluar políticas, lineamientos, planes, programas, acciones y normas internas en materia de extensión cultural y proyección social.","Supervisar y evaluar políticas, lineamientos, planes, programas, acciones y normas internas en materia de Servicios Educativos de Extensión.","Diseñar, implementar y reportar mecanismos de seguimiento, evaluación, medición de impacto y rendición de cuentas de las acciones de responsabilidad social universitaria.","Conducir, articular, supervisar y evaluar políticas, lineamientos, planes, programas, acciones y normas internas en materia de voluntariado universitario, en coordinación con las Facultades y Escuelas Profesionales cuando corresponda el reconocimiento académico","Conducir, articular y supervisar políticas, lineamientos, planes, programas, acciones y normas internas en materia de gestión ambiental y desarrollo sostenible, en coordinación con la Unidad de Desarrollo Sostenible.","Conducir, articular, supervisar y evaluar políticas, lineamientos, planes, programas, acciones y normas internas en materia de Fondo Editorial.","Realizar otras funciones en materia de su competencia que le asigne el Rectorado, conforme al Estatuto, el ROF y demás normativa aplicable."]},{"n":92,"t":"Unidad de Desarrollo Sostenible","c":"CAPÍTULO VII","b":["La Unidad de Desarrollo Sostenible es la unidad orgánica dependiente de la Dirección de Responsabilidad Social y Desarrollo Sostenible, responsable de proponer, ejecutar, articular y efectuar seguimiento técnico de actividades e intervenciones de responsabilidad social, desarrollo sostenible, gestión ambiental y voluntariado universitario en la Universidad."]},{"n":93,"t":"Funciones de la Unidad de Desarrollo Sostenible","c":"CAPÍTULO VII","b":["Ejecutar políticas y lineamientos en materia de desarrollo sostenible y gestión ambiental institucional, en coordinación con las unidades de organización de la Universidad.","Promover, coordinar y ejecutar acciones conjuntas con el Estado, la sociedad civil y entidades especializadas para abordar temas de desarrollo sostenible, gestión ambiental, cambio climático, agua limpia, saneamiento, ciudades sostenibles, y producción responsable.","Elaborar y proponer políticas, lineamientos, proyectos y criterios técnicos de desarrollo sostenible y gestión ambiental institucional aplicables a las unidades de organización de la Universidad.","Organizar, coordinar y ejecutar capacitaciones, talleres, campañas y eventos sobre desarrollo sostenible, gestión ambiental, ecoeficiencia, cambio climático y responsabilidad social universitaria.","Brindar asistencia técnica a las unidades de organización para incorporar criterios de desarrollo sostenible, gestión ambiental y ecoeficiencia.","Promover y articular la incorporación de criterios de desarrollo sostenible y gestión ambiental en programas, proyectos y actividades de pregrado, posgrado, educación continua e investigación, en coordinación con los órganos académicos y de investigación competentes.","Promover valores, actitudes y participación de la comunidad universitaria y actores externos en iniciativas de responsabilidad social, sostenibilidad y gestión ambiental.","Fomentar y difundir prácticas de gestión ambiental, ecoeficiencia, consumo responsable y sostenibilidad en la Universidad.","Promover, organizar, articular, ejecutar y efectuar seguimiento técnico del voluntariado universitario institucional en acciones de responsabilidad social, desarrollo sostenible, gestión ambiental, ciudadanía y servicio a la sociedad, en coordinación con las Facultades y Escuelas Profesionales cuando corresponda el reconocimiento académico.","Realizar las demás funciones que le asigne la Dirección de Responsabilidad Social y Desarrollo Sostenible en el ámbito de sus competencias y conforme a la normativa aplicable."]},{"n":94,"t":"Unidad de Servicios de Extensión","c":"CAPÍTULO VII","b":["La Unidad de Servicios de Extensión es la unidad orgánica de línea dependiente de la Dirección de Responsabilidad Social y Desarrollo Sostenible, responsable de brindar a la comunidad servicios de extensión."]},{"n":95,"t":"Funciones de la Unidad de Servicios de Extensión","c":"CAPÍTULO VII","b":["Proponer, ejecutar y controlar el cumplimiento del Plan y Presupuesto de la Unidad con la finalidad de garantizar el alcance de los objetivos.","Proponer y cumplir con las directivas, reglamentos y/o normas de funcionamiento de la Unidad.","Gestionar los servicios de extensión universitaria en su ciclo integral, desde la planificación, el desarrollo, la promoción, la prestación y la oferta hasta la evaluación de su calidad, de acuerdo con las necesidades de la comunidad.","Cumplir con las políticas y lineamientos de gestión, operación, evaluación y rendición de cuentas de los recursos económicos que usen y generen.","Realizar el monitoreo de la programación y ejecución de las metas físicas y económicas reportando su cumplimiento al nivel superior.","Ejecutar y mantener las actividades en el Sistema de Control Interno que correspondan a la unidad en el marco de las funciones y competencias.","Asegurar la disponibilidad de la infraestructura, equipamiento y recursos necesarios para el buen desempeño de los servicios de extensión que sean necesarios para su correcto desarrollo.","Realizar otras funciones en materia de su competencia que le asigne la Dirección de Responsabilidad Social y Desarrollo Sostenible."]},{"n":96,"t":"La Universidad cuenta con las siguientes Unidades de Servicios de Extensión","c":"CAPÍTULO VII","b":["Centro de Extensión y Proyección Social (CEPS-UNI)","Centro de Idiomas UNI","Centro de Infraestructura y Proyectos (CENIP)"]},{"n":97,"t":"Unidad de Centro Cultural UNI","c":"CAPÍTULO VII","b":["La Unidad de Centro Cultural UNI es la unidad orgánica de línea dependiente de la Dirección de Responsabilidad Social y Desarrollo Sostenible, responsable de promocionar y gestionar la ejecución de programas y actividades de práctica y difusión de expresiones culturales y de arte nacional e internacional que favorezca la participación de la comunidad universitaria."]},{"n":98,"t":"Funciones de la Unidad de Centro Cultural UNI","c":"CAPÍTULO VII","b":["Promover, desarrollar y difundir los programas y actividades de práctica y formación de danzas, música, canto, artes escénicas, visuales y plásticas, y demás expresiones culturales y artísticas orientadas a la comunidad universitaria y a la sociedad en general.","Gestionar cultural, administrativa y económicamente el Centro Cultural UNI en coordinación con las unidades de organización pertinentes de la administración central.","Promocionar y difundir la actividad y trabajo cultural y artístico desarrollado en la Universidad a la sociedad, y contribuir a la preservación de las expresiones culturales y artísticas del país, y afirmación de nuestra identidad nacional.","Complementar la formación integral de los estudiantes con la experiencia cultural y artística que contribuya al desarrollo cultural, identificación, conservación, preservación, promoción, difusión y puesta en valor del patrimonio cultural de la Universidad.","Proponer y ejecutar el Plan Anual Cultural Universitario de la Universidad Nacional de Ingeniería.","Impulsar las actividades formativas y organización de eventos relacionados con la música vocal e instrumental, folklore, danza y artes escénicas en favor de los miembros de la comunidad universitaria.","Dirigir los grupos de danzas, música y de teatro, y el Coro Universitario en sus presentaciones.","Gestionar el Gran Teatro de la UNI, orientado a atender las necesidades de los actores de la comunidad universitaria y de la sociedad en general.","Organizar, desarrollar y certificar la participación de las actividades extracurriculares de los estudiantes de la Universidad en la preparación y realización de eventos culturales y artísticos.","Coordinar con otras entidades del Estado, la conducción de acciones de defensa y gestión del patrimonio cultural de la Nación.","Preservar el patrimonio cultural de la Universidad en condiciones adecuadas.","Promover la cooperación técnica y financiera no reembolsable nacional e internacional orientada a la ejecución de proyectos y programas artísticos y culturales que coadyuven al fortalecimiento de la identidad cultural y artística de la comunidad universitaria, en coordinación con la Oficina de Cooperación y Relaciones Internacionales.","Facilitar los mecanismos y espacios de participación y concertación para la realización de las actividades de reflexión y debate en temas culturales en la comunidad universitaria.","Supervisar los ambientes de la Universidad destinados para la realización de actividades de práctica y formación artísticas de danzas, musicales, can so y difusión de la producción académica y científica de la Universidad, contribuyendo al desarrollo de la docencia, la investigación, la innovación, la ciencia abierta y la transformación digital."]},{"n":102,"t":"Funciones de la Dirección de Biblioteca Central","c":"CAPÍTULO VII","b":["Dirigir la gestión del Sistema de Bibliotecas de la Universidad, estableciendo y supervisando la aplicación de lineamientos y estándares técnicos comunes en las Bibliotecas de las Facultades, en coordinación con los Decanos para contribuir al fortalecimiento y desarrollo de los servicios bibliotecarios institucionales.","Proponer y ejecutar. las políticas, planes, programas y proyectos relacionados con la gestión bibliotecaria.","Administrar, y promover el desarrollo funcional de las plataformas y servicios digitales del Sistema de Bibliotecas de la Universidad, en el ámbito de la gestión bibliotecaria y de los recursos de la información, en coordinación con la Oficina de Tecnologías de la Información en los aspectos de infraestructura tecnológica que correspondan.","Organizar, integrar, conservar y mantener actualizado el acervo bibliográfico físico y virtual, que constituye el patrimonio cultural de la Universidad.","Planificar, organizar y supervisar la prestación de los servicios bibliográficos presenciales y virtuales.","Orientar y capacitar a los usuarios en el uso de los recursos y servicios de información disponibles, brindando asesoramiento en búsquedas bibliográficas, bases de datos y desarrollo de competencias informacionales para el apoyo a la docencia y la investigación.","Administrar el Repositorio Institucional de la Universidad Nacional de Ingeniería, garantizando la preservación, accesibilidad, interoperabilidad y visibilidad de la producción académica, científica y tecnológica de la Universidad, bajo las normativas nacionales vigentes.","Establecer y fortalecer vínculos de cooperación con bibliotecas, redes académicas, organismos nacionales e internacionales relacionados con la gestión de bibliotecas.","Promover el acceso abierto y la ciencia abierta mediante acciones orientadas al acceso, preservación, difusión y visibilidad de la producción académica y científica de la Universidad, en el marco de la normativa nacional vigente.","Realizar otras funciones en materia de su competencia que le asigne el Vicerrectorado Académico y/o la Alta Dirección."]},{"n":103,"t":"Dirección de Registro Central y Estadística","c":"CAPÍTULO VII","b":["La Dirección de Registro Central y Estadística es el órgano de línea dependiente del Vicerrectorado Académico responsable de desarrollar todos los procesos de incorporación, registro académico, matrícula y control de notas de los estudiantes, desde su ingreso hasta su graduación."]},{"n":104,"t":"Funciones de la Dirección de Registro Central y Estadística","c":"CAPÍTULO VII","b":["Diseñar y proponer al Vicerrectorado Académico, las políticas, normas y procesos estándares que sirvan de base para el desarrollo, uso y aplicación de la información en los procesos de gestión académica de la Universidad.","Facilitar el registro de la información académica de la Universidad en coordinación con las Facultades.","Gestionar funcionalmente la información y los registros académicos, asegurando su integridad y confidencialidad, en coordinación con la Oficina de Tecnologías de la Información para los aspectos de infraestructura tecnológica y seguridad de la información.","Monitorear y dar soporte a las Facultades en los procesos de matrícula y registro de carga de notas; así como en otros procesos relacionados con asuntos académicos de su responsabilidad.","Emitir los certificados oficiales de estudio, así como verificar la documentación exigida y registrada, y emitir las constancias de egresado.","Facilitar, procesar y proveer la información estadística que requiera la Alta Dirección, las distintas Facultades, otras unidades de organización de la Universidad y otras entidades autorizadas que las soliciten, así ados, asistencia técnica y consultoría en telecomunicaciones, tecnologías de información y áreas afines.","Desarrollar programas de formación, capacitación, especialización y actualización profesional y técnica en telecomunicaciones, tecnologías de información y áreas afines, incluyendo acciones orientadas al fortalecimiento de capacidades, inclusión, y al cierre de brechas digitales.","Brindar asistencia técnica, capacitación, consultoría y servicios especializados en telecomunicaciones, tecnologías de información, innovación y transformación digital, de acuerdo con las competencias y capacidades de INICTEL-UNI.","Gestionar y desarrollar la infraestructura, laboratorios, equipamiento, plataformas, redes y demás capacidades científicas y tecnológicas necesarias para la investigación, formación, capacitación especializada, y prestación de servicios especializados, incluyendo las medidas de seguridad digital correspondientes, en coordinación con la OTI cuando corresponda.","Dirigir, promover y fortalecer el sistema de gestión de la investigación, desarrollo tecnológico e innovación (I+D+i) del INICTEL UNI, en concordancia con las políticas nacionales de ciencia, tecnología e innovación (CTI) y la normativa vigente.","Gestionar y efectuar el seguimiento y evaluación de estudios técnicos, proyectos de inversión y demás proyectos tecnológicos a cargo de INICTEL-UNI, conforme a la normativa aplicable y en el ámbito de sus competencias.","Evaluar y fortalecer el desempeño de las actividades de investigación, desarrollo tecnológico, innovación y servicios tecnológicos especializados de INICTEL-UNI, de acuerdo con los instrumentos institucionales y los criterios establecidos por los órganos rectores competentes.","Promover la articulación de INICTEL-UNI con las unidades académicas y de investigación de la Universidad para el desarrollo de actividades académicas, científicas y tecnológicas; así como proponer y gestionar convenios y contratos necesarios para el cumplimiento de   if(/^Direcci[oó]n/i.test(u.name)) return 'Director(a)';
